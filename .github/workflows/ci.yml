name: CI

# Runs exactly what a developer runs: `make verify` (no network) and
# `make verify-security` (advisories, secrets, image platforms). Keep any new
# check in the Makefile, not here; tests/test_ci_parity.py enforces it.
# Actions are pinned to commits; Dependabot proposes updates (.github/dependabot.yml).

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.12.5'}
      - name: Install control-plane and developer dependencies
        run: uv sync --frozen
      - name: Verify (lint, types, tests, deployable contract, dashboard build)
        run: make verify UV=uv
      - name: Verify security (advisories, committed secrets, image platforms)
        run: make verify-security UV=uv
      - name: Python SBOM
        run: make sbom UV=uv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mu3lab-sbom
          path: mu3lab-python-sbom.json
