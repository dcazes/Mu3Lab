name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm', cache-dependency-path: dashboard/package-lock.json}
      - name: Prove fresh-checkout bootstrap needs no installed Python packages
        run: MU3LAB_BOOTSTRAP_TESTS=1 python tools/run_tests.py
      - name: Install control-plane dependencies
        run: python -m pip install -r ctl/requirements.txt
      - name: Python tests and compilation
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q ctl
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Validate checked-in YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('services.yaml'), Path('catalog.yaml'), Path('mcp-catalog.yaml'),
                       *Path('core').glob('**/docker-compose.yml'),
                       *Path('apps').glob('**/docker-compose.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
      - name: Validate Compose interpolation
        run: |
          while IFS= read -r compose_file; do
            MU3LAB_ENV_FILE=/dev/null \
            AUTHENTIK_ENV_FILE=/dev/null \
            AUTHENTIK_TAG=2026.5.0 \
            AUTHENTIK_SECRET_KEY=ci-placeholder \
            AUTHENTIK_POSTGRESQL__PASSWORD=ci-placeholder \
            MU3LAB_INGRESS_TOKEN=ci-placeholder \
            MU3LAB_DATA_ROOT=/srv/mu3lab/data \
            DB_PASSWORD=ci-placeholder \
            SECRET_KEY=ci-placeholder \
            ZERO_ADMIN_PASSWORD=ci-placeholder \
            SEARXNG_SECRET=ci-placeholder \
            SURFSENSE_PUBLIC_URL=https://example.ts.net:8447 \
            POSTGRES_PASSWORD=ci-placeholder \
            DJANGO_ADMIN_USERNAME=ci-operator \
            DJANGO_ADMIN_EMAIL=operator@example.test \
            DJANGO_ADMIN_PASSWORD=ci-placeholder \
            PAPERLESS_ADMIN_USER=ci-operator \
            PAPERLESS_ADMIN_MAIL=operator@example.test \
            PAPERLESS_ADMIN_PASSWORD=ci-placeholder \
            PAPERLESS_DBPASS=ci-placeholder \
            PAPERLESS_SECRET_KEY=ci-placeholder \
            ACTUAL_PASSWORD=ci-placeholder \
            ACTUAL_BUDGET_SYNC_ID=ci-placeholder \
            MCP_AUTH_TOKEN=ci-placeholder \
            MEALIE_API_TOKEN=ci-placeholder \
            IMMICH_API_KEY=ci-placeholder \
            PAPERLESS_API_KEY=ci-placeholder \
            BULL_AUTH_KEY=ci-placeholder \
            RABBITMQ_DEFAULT_PASS=ci-placeholder \
            NEXTCLOUD_USERNAME=ci-operator \
            NEXTCLOUD_APP_PASSWORD=ci-placeholder \
            ADVENTURELOG_API_KEY=ci-placeholder \
            HOMARR_SECRET_ENCRYPTION_KEY=ci-placeholder \
            HOMARR_BASE_URL=https://example.ts.net:7575 \
            HOMARR_OIDC_CLIENT_ID=ci-placeholder \
            HOMARR_OIDC_CLIENT_SECRET=ci-placeholder \
            HOMARR_OIDC_ISSUER=https://example.ts.net/application/o/homarr/ \
            HOMARR_OIDC_LOGOUT_URL=https://example.ts.net/if/session-end/ \
            HOMARR_CONTROL_TOKEN=ci-placeholder \
            APP_URL=https://example.ts.net:8448 \
            AUTH_AUTHENTIK_ID=ci-placeholder \
            AUTH_AUTHENTIK_ISSUER=https://example.ts.net/application/o/lobehub/ \
            AUTH_AUTHENTIK_SECRET=ci-placeholder \
            AUTH_SECRET=ci-placeholder \
            KEY_VAULTS_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            LITELLM_MASTER_KEY=ci-placeholder \
            RUSTFS_ACCESS_KEY=ci-placeholder \
            RUSTFS_SECRET_KEY=ci-placeholder \
            S3_ENDPOINT=http://rustfs:9000 \
            NEXTCLOUD_TRUSTED_DOMAINS=cloud.example.test \
            NEXTCLOUD_OVERWRITECLIURL=https://cloud.example.test \
            NEXTCLOUD_OVERWRITEHOST=cloud.example.test \
            NEXTCLOUD_DB_PASSWORD=ci-placeholder \
            NEXTCLOUD_REDIS_PASSWORD=ci-placeholder \
              docker compose -f "$compose_file" config --quiet
          done < <(find core apps -name docker-compose.yml -type f | sort)
      - name: Scan tracked files for accidental private environment files
        run: |
          ! git ls-files | grep -E '(^|/)\.env$'
          ! git ls-files | grep -E '(^|/)(data|backups|runtime)/'
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Python SBOM
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file mu3lab-python-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: mu3lab-sbom
          path: mu3lab-python-sbom.json
