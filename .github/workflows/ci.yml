name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm', cache-dependency-path: dashboard/package-lock.json}
      - name: Install control-plane dependencies
        run: python -m pip install -r ctl/requirements.txt
      - name: Python tests and compilation
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q ctl
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Validate checked-in YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path('services.yaml'), Path('catalog.yaml'), *Path('core').glob('*/docker-compose.yml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
      - name: Scan tracked files for accidental private environment files
        run: |
          ! git ls-files | grep -E '(^|/)\.env$'
          ! git ls-files | grep -E '(^|/)(data|backups|runtime)/'
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
