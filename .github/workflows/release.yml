name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  inventory:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - run: uv sync --frozen
      - id: images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Only normal releases are published'; exit 1; }
          echo "matrix=$(uv run --frozen python -m tools.release_artifacts matrix)" >> "$GITHUB_OUTPUT"
  images:
    needs: [validate, inventory]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          mkdir -p /tmp/image-digests
          printf '%s\n' "$IMAGE_DIGEST" > "/tmp/image-digests/$IMAGE_NAME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/image-digests/*.txt
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - run: uv sync --frozen
      - name: Build dashboard in pinned container
        run: uv run --frozen python -m tools.dashboard build
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: .tools/release-digests
      - name: Package and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen python -m tools.release_artifacts package --tag "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes .tools/release-assets/*
