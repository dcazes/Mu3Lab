<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">How Mu3Lab fits together</title>
  <desc id="d">Devices reach Mu3Lab only through Tailscale. Caddy routes requests and Authentik provides one sign-in. The dashboard manages the apps. Open WebUI or LobeChat reach app tools through ContextForge, and AI models through LiteLLM, which routes to local Ollama models or outside providers via FreeLLMAPI.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f7f7f9; stroke: #dedee6; }
    .group { fill: none; stroke: #d0d0da; stroke-dasharray: 5 5; }
    .accent { fill: #eef0ff; stroke: #5e6ad2; }
    .tool { fill: #f4efff; stroke: #8b5cf6; }
    .h { fill: #15151c; }
    .s { fill: #5d5d6e; }
    .lbl { fill: #7a7a8c; }
    .line { stroke: #9a9aae; fill: none; }
    .mcp { stroke: #8b5cf6; fill: none; stroke-dasharray: 6 5; }
    .mcptext { fill: #7c4ddf; }
    .arrow { fill: #9a9aae; }
    .arrowm { fill: #8b5cf6; }
    .chip { fill: #ffffff; stroke: #dedee6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f0f14; }
      .card { fill: #17171f; stroke: #2c2c38; }
      .group { stroke: #34343f; }
      .accent { fill: #1c1d33; stroke: #6f78e0; }
      .tool { fill: #221a36; stroke: #a78bfa; }
      .h { fill: #f0f0f6; }
      .s { fill: #a3a3b6; }
      .lbl { fill: #8a8a9e; }
      .line { stroke: #5c5c70; }
      .mcp { stroke: #a78bfa; }
      .mcptext { fill: #b9a2fb; }
      .arrow { fill: #5c5c70; }
      .arrowm { fill: #a78bfa; }
      .chip { fill: #1f1f29; stroke: #34343f; }
    }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 13px; }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrow"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrowm"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="660" rx="20"/>

  <text x="40" y="48" class="lbl">YOUR DEVICES</text>
  <text x="290" y="48" class="lbl">PRIVATE FRONT DOOR</text>
  <text x="560" y="48" class="lbl">YOUR MU3LAB SERVER</text>

  <!-- Devices -->
  <rect x="40" y="70" width="200" height="92" rx="12" class="card"/>
  <text x="60" y="104" class="h">Laptop &amp; phone</text>
  <text x="60" y="126" class="s">Browser or installed</text>
  <text x="60" y="144" class="s">dashboard app</text>

  <rect x="40" y="182" width="200" height="92" rx="12" class="card"/>
  <text x="60" y="216" class="h">Bitwarden</text>
  <text x="60" y="238" class="s">Fills saved app logins</text>
  <text x="60" y="256" class="s">from your own vault</text>

  <rect x="40" y="294" width="200" height="92" rx="12" class="card"/>
  <text x="60" y="328" class="h">Official mobile apps</text>
  <text x="60" y="350" class="s">Immich, Nextcloud and</text>
  <text x="60" y="368" class="s">others, set up by QR code</text>

  <!-- Front door -->
  <rect x="290" y="70" width="220" height="316" rx="14" class="group"/>
  <rect x="306" y="86" width="188" height="86" rx="12" class="accent"/>
  <text x="324" y="118" class="h">Tailscale</text>
  <text x="324" y="140" class="s">Private HTTPS for</text>
  <text x="324" y="157" class="s">approved devices</text>

  <rect x="306" y="186" width="188" height="86" rx="12" class="card"/>
  <text x="324" y="218" class="h">Caddy</text>
  <text x="324" y="240" class="s">Routes each app to</text>
  <text x="324" y="257" class="s">its private address</text>

  <rect x="306" y="286" width="188" height="86" rx="12" class="card"/>
  <text x="324" y="318" class="h">Authentik</text>
  <text x="324" y="340" class="s">One sign-in for the</text>
  <text x="324" y="357" class="s">dashboard and apps</text>

  <line x1="400" y1="172" x2="400" y2="184" class="line" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="272" x2="400" y2="284" class="line" stroke-width="2" marker-end="url(#a)"/>

  <path d="M240 116 H290" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M240 228 H270 V140 H290" class="line" stroke-width="2"/>
  <path d="M240 340 H270 V228" class="line" stroke-width="2"/>

  <!-- Server -->
  <rect x="560" y="70" width="600" height="456" rx="14" class="group"/>

  <rect x="580" y="88" width="330" height="96" rx="12" class="accent"/>
  <text x="600" y="120" class="h">Mu3Lab dashboard</text>
  <text x="600" y="142" class="s">Install, start, stop, update and back up</text>
  <text x="600" y="160" class="s">apps. Long tasks run as resumable jobs.</text>

  <rect x="926" y="88" width="214" height="96" rx="12" class="card"/>
  <text x="946" y="120" class="h">Vaultwarden</text>
  <text x="946" y="142" class="s">Password vault that</text>
  <text x="946" y="160" class="s">receives app logins</text>

  <rect x="580" y="200" width="560" height="120" rx="12" class="card"/>
  <text x="600" y="230" class="h">Your apps</text>
  <g>
    <rect x="600" y="244" width="82" height="28" rx="14" class="chip"/><text x="641" y="263" text-anchor="middle" class="s">Immich</text>
    <rect x="690" y="244" width="96" height="28" rx="14" class="chip"/><text x="738" y="263" text-anchor="middle" class="s">Nextcloud</text>
    <rect x="794" y="244" width="116" height="28" rx="14" class="chip"/><text x="852" y="263" text-anchor="middle" class="s">Paperless-ngx</text>
    <rect x="918" y="244" width="76" height="28" rx="14" class="chip"/><text x="956" y="263" text-anchor="middle" class="s">Mealie</text>
    <rect x="1002" y="244" width="120" height="28" rx="14" class="chip"/><text x="1062" y="263" text-anchor="middle" class="s">Actual Budget</text>
    <rect x="600" y="280" width="116" height="28" rx="14" class="chip"/><text x="658" y="299" text-anchor="middle" class="s">AdventureLog</text>
    <rect x="724" y="280" width="70" height="28" rx="14" class="chip"/><text x="759" y="299" text-anchor="middle" class="s">Grocy</text>
    <rect x="802" y="280" width="80" height="28" rx="14" class="chip"/><text x="842" y="299" text-anchor="middle" class="s">Outline</text>
    <rect x="890" y="280" width="104" height="28" rx="14" class="chip"/><text x="942" y="299" text-anchor="middle" class="s">Navidrome</text>
    <rect x="1002" y="280" width="120" height="28" rx="14" class="chip"/><text x="1062" y="299" text-anchor="middle" class="s">and more</text>
  </g>

  <rect x="580" y="340" width="330" height="48" rx="12" class="tool"/>
  <text x="600" y="370" class="h">ContextForge</text>
  <text x="710" y="370" class="s">MCP gateway for app tools</text>
  <path d="M745 340 V322" class="mcp" stroke-width="2" marker-end="url(#am)"/>
  <text x="926" y="362" class="mcptext" font-size="13" font-weight="600">One virtual server</text>
  <text x="926" y="380" class="mcptext" font-size="13" font-weight="600">per app connector</text>

  <rect x="580" y="408" width="170" height="100" rx="12" class="accent"/>
  <text x="600" y="440" class="h">Open WebUI</text>
  <text x="600" y="462" class="s">or LobeChat, with</text>
  <text x="600" y="480" class="s">one assistant per app</text>
  <path d="M665 408 V390" class="mcp" stroke-width="2" marker-end="url(#am)"/>

  <rect x="782" y="408" width="146" height="100" rx="12" class="card"/>
  <text x="802" y="440" class="h">LiteLLM</text>
  <text x="802" y="462" class="s">One model gateway</text>
  <text x="802" y="480" class="s">for chat and apps</text>

  <rect x="960" y="408" width="180" height="46" rx="12" class="card"/>
  <text x="978" y="430" class="h">Ollama</text>
  <text x="978" y="446" class="s">Local models</text>

  <rect x="960" y="462" width="180" height="46" rx="12" class="card"/>
  <text x="978" y="484" class="h">FreeLLMAPI</text>
  <text x="978" y="500" class="s">Outside AI providers</text>

  <path d="M750 458 H780" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M928 458 H944 V431 H958" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M944 458 V485 H958" class="line" stroke-width="2" marker-end="url(#a)"/>

  <path d="M510 228 H540 V136 H578" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M540 228 V260 H578" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M540 260 V458 H578" class="line" stroke-width="2" marker-end="url(#a)"/>
  <path d="M510 228 H540" class="line" stroke-width="2"/>

  <rect x="40" y="556" width="1120" height="68" rx="12" class="card"/>
  <text x="64" y="584" class="h">Your data stays in /srv/mu3lab on this computer</text>
  <text x="64" y="606" class="s">No router port forwarding · images pinned to reviewed digests · app secrets encrypted at rest · outside AI is optional (Local only mode)</text>
</svg>
