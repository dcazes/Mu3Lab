# Firecrawl — see ctl/manifest/models.py for every field.
id: firecrawl
name: Firecrawl
tier: core
group: ai
category: research
tagline: Turns web pages into AI-ready text
summary: Converts web pages into Markdown and structured data for AI tools. Mu3Lab runs the self-hosted scraping
  and crawling API and connects it to chat for web research.
version: v2.11.450
upstream: firecrawl/firecrawl
service:
  local_port: 3002
  health:
    path: /
  stoppable: false
route:
  https_port: 8456
  caddy_port: 19473
  access: open
sign_in:
  method: none
  note: Firecrawl is an API service with no application login. Its route remains private to the tailnet.
account:
  user_action: No login is required on the private Firecrawl API route.
secrets:
- env: POSTGRES_PASSWORD
- env: RABBITMQ_DEFAULT_PASS
- env: BULL_AUTH_KEY
chat:
  assistant:
    title: Firecrawl
    description: Collect and analyze web content.
    instructions: Help collect web content with Firecrawl tools assigned to this agent. Explain when a request will
      fetch external pages or start a crawl. Ask before starting large crawls.
  connectors:
  - firecrawl-official
ui:
  label: Open API
resource_guidance: Runs Firecrawl workers, Playwright, RabbitMQ, PostgreSQL, and Redis. Browser crawls can use substantial
  memory; concurrency defaults are intentionally conservative.
setup_action: Install the private Firecrawl API, queue workers, Playwright browser service, and durable data services.
