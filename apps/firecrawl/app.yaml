# Firecrawl — see ctl/manifest/models.py for every field.
id: firecrawl
capabilities: [web_fetch]
name: Firecrawl
tier: optional
group: ai
category: knowledge
tagline: Turns web pages into AI-ready text
summary: Converts web pages into Markdown and structured data for AI tools. Mu3Lab runs the self-hosted scraping
  and crawling API inside the server and connects it to chat for web research.
version: v2.11.450
upstream: firecrawl/firecrawl
service:
  local_port: 3002
  health:
    path: /
sign_in:
  method: none
  note: Internal-only web scraping API with no login; only chat's Firecrawl connector reaches it, inside the server.
secrets:
- env: POSTGRES_PASSWORD
- env: RABBITMQ_DEFAULT_PASS
- env: BULL_AUTH_KEY
chat:
  assistant:
    title: Firecrawl
    description: Collect and analyze web content.
    instructions: Help collect web content with Firecrawl tools assigned to this agent. Explain when a request will
      fetch external pages or start a crawl. Ask before starting large crawls.
    faq:
    - question: "What does Firecrawl do?"
      answer: "Fetches web pages and turns them into clean text, so assistants can read, summarise or compare them."
    - question: "Does it go on the internet?"
      answer: "Yes: it visits the pages you ask about. Large crawls of a whole site take longer and are confirmed first."
  connectors:
  - firecrawl-official
ui:
  available: false
  unavailable_reason: Firecrawl is an internal API for chat's web research; it has no browser interface.
resource_guidance: Runs Firecrawl workers, Playwright, RabbitMQ, PostgreSQL, and Redis. Browser crawls can use substantial
  memory; concurrency defaults are intentionally conservative.
setup_action: Install the private Firecrawl API, queue workers, Playwright browser service, and durable data services.
