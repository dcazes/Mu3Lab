name: mu3lab-surfsense

services:
  db:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      POSTGRES_USER: ${DB_USER:-surfsense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-surfsense}
    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/postgres:/var/lib/postgresql/data"]
    networks: [mu3lab_backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-surfsense} -d ${DB_NAME:-surfsense}"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrations:
    image: ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973
    restart: "no"
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}
      PYTHONPATH: /app
      SERVICE_ROLE: migrate
      MIGRATION_TIMEOUT: 900
    networks: [mu3lab_backend]
    depends_on:
      db: {condition: service_healthy}

  redis:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/redis:/data"]
    networks: [mu3lab_backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  searxng:
    image: searxng/searxng:2026.3.13-3c1f68c59@sha256:174f6a8498d88d2d98c265a952c2d552859bf315cd505746d1c0d4fbec37952f
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks: [mu3lab_backend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973
    restart: unless-stopped
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_APP_URL: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      UVICORN_LOOP: asyncio
      UNSTRUCTURED_HAS_PATCHED_LOOP: "1"
      FILE_STORAGE_LOCAL_PATH: /app/.local_object_store
      NEXT_FRONTEND_URL: ${SURFSENSE_PUBLIC_URL}
      BACKEND_URL: ${SURFSENSE_PUBLIC_URL}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-TRUE}
      SEARXNG_URL: http://searxng:8080
      SANDBOX_ENABLED: "FALSE"
      SERVICE_ROLE: api
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/shared:/shared_tmp
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/object-store:/app/.local_object_store
    networks:
      mu3lab_backend:
        aliases: [surfsense-backend]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 200s

  celery_worker:
    image: ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973
    restart: unless-stopped
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_APP_URL: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      FILE_STORAGE_LOCAL_PATH: /app/.local_object_store
      SEARXNG_URL: http://searxng:8080
      SANDBOX_ENABLED: "FALSE"
      SERVICE_ROLE: worker
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/shared:/shared_tmp
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/object-store:/app/.local_object_store
    networks: [mu3lab_backend]
    depends_on:
      migrations: {condition: service_completed_successfully}
      backend: {condition: service_healthy}

  celery_beat:
    image: ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973
    restart: unless-stopped
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: surfsense
      PYTHONPATH: /app
      SERVICE_ROLE: beat
    networks: [mu3lab_backend]
    depends_on:
      migrations: {condition: service_completed_successfully}
      celery_worker: {condition: service_started}

  zero-cache:
    image: rocicorp/zero:1.6.0@sha256:53e66c78b2d2ecf240b6d0e9e0c9c77d2abd6774a0efa84107b5c86ac9f59965
    restart: unless-stopped
    stop_grace_period: 300s
    environment:
      ZERO_UPSTREAM_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_CVR_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_CHANGE_DB: postgresql://${DB_USER:-surfsense}:${DB_PASSWORD}@db:5432/${DB_NAME:-surfsense}?sslmode=disable
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?ZERO_ADMIN_PASSWORD is required}
      ZERO_APP_PUBLICATIONS: zero_publication
      ZERO_AUTO_RESET: "true"
      ZERO_NUM_SYNC_WORKERS: 4
      ZERO_UPSTREAM_MAX_CONNS: 20
      ZERO_CVR_MAX_CONNS: 30
      ZERO_QUERY_URL: http://frontend:3000/api/zero/query
      ZERO_MUTATE_URL: http://frontend:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/zero-cache:/data"]
    networks: [mu3lab_backend]
    depends_on:
      db: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 600s

  frontend:
    image: ghcr.io/modsetter/surfsense-web:0.0.40@sha256:47e0f832c4c6ddbc5a144e4960ab1de9cd70c68926436cfc2099553f14595b55
    restart: unless-stopped
    environment:
      AUTH_TYPE: LOCAL
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-TRUE}
      ETL_SERVICE: DOCLING
      DEPLOYMENT_MODE: self-hosted
      SURFSENSE_BACKEND_INTERNAL_URL: http://backend:8000
    networks: [mu3lab_backend]
    depends_on:
      backend: {condition: service_healthy}
      zero-cache: {condition: service_healthy}

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["127.0.0.1:3929:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks:
      mu3lab_backend:
        aliases: [surfsense-proxy]
    depends_on:
      frontend: {condition: service_started}
      backend: {condition: service_healthy}
      zero-cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  mu3lab_backend: {external: true}
