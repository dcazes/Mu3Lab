name: mu3lab-surfsense

# SurfSense's own Docker product: one container (its API, workers, model servers and
# a Caddy that is its only listener) over one /data folder. One shared library for the
# household; Authentik on Mu3Lab's ingress is the only way in.
services:
  surfsense:
    image: ghcr.io/modsetter/surfsense:2.3.1@sha256:106baa89d5f79168c1c5e9bce77655d3e99f2950250772a1d41508c04d73a4a0
    restart: unless-stopped
    ports: ["127.0.0.1:3929:80"]
    environment:
      # Authentik decides who reaches it, so SurfSense asks for no password of its own.
      SURFSENSE_AUTH: none
      # Only its private address and the server itself; another name is a rebinding page's.
      SURFSENSE_ALLOWED_HOSTS: ${SURFSENSE_ALLOWED_HOSTS:?SURFSENSE_ALLOWED_HOSTS is required}
      # Encrypts the API keys it stores (the AI gateway's); kept with Mu3Lab's other secrets.
      SURFSENSE_LOCAL_SECRET: ${SURFSENSE_LOCAL_SECRET:?SURFSENSE_LOCAL_SECRET is required}
      SURFSENSE_LOCAL_PUBLIC_PORT: ${SURFSENSE_PUBLIC_PORT:-8447}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/data:/data
    depends_on:
      data-init: {condition: service_completed_successfully}
    # mu3lab_frontend publishes its port and lets it reach the web (research, crawling);
    # mu3lab_backend reaches the AI gateway.
    networks: [mu3lab_frontend, mu3lab_backend]
    # Its supervisor gives each sidecar 5 s after SIGTERM; Docker's 10 s is too tight.
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Its Caddy binary carries the port-binding capability, so starting it needs that one back.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      timeout: 5s
      # A first start migrates its database and loads the document parser.
      start_period: 300s
      start_interval: 5s
      interval: 5m
      retries: 3

  # The image runs as "surfsense" (1000); a folder Docker creates belongs to root.
  data-init:
    image: ghcr.io/modsetter/surfsense:2.3.1@sha256:106baa89d5f79168c1c5e9bce77655d3e99f2950250772a1d41508c04d73a4a0
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/surfsense/data:/data
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
