# SurfSense — see ctl/manifest/models.py for every field.
id: surfsense
capabilities: [research]
name: SurfSense
tier: optional
group: apps
category: knowledge
tagline: AI research with cited sources
summary: An AI research workspace for collecting files, web pages and notes as sources, then asking questions across
  them with citations. One library shared by the whole household; Mu3Lab connects it to the household chat model.
version: "v2.3.1"
upstream: MODSetter/SurfSense
depends_on:
- litellm
service:
  local_port: 3929
  health:
    path: /api/health
  start_timeout_seconds: 900
route:
  https_port: 8447
  caddy_port: 19464
  access: gate
sign_in:
  method: gate
  note: Authentik guards the private address and is the only sign-in. SurfSense has no accounts of its own, so its
    password is switched off.
secrets:
- env: SURFSENSE_LOCAL_SECRET
  length: 48
# The value of its own AI gateway key (gateway_key rule); LiteLLM keys start with sk-.
- env: LITELLM_APP_KEY
  kind: hex
  length: 24
env:
  SURFSENSE_ALLOWED_HOSTS: '{{dns_name}}'
  SURFSENSE_PUBLIC_PORT: '{{https_port}}'
  # Its own AI gateway key, for the household chat model; hooks.py hands it to SurfSense.
  MU3LAB_AI_KEY: 'sk-{{LITELLM_APP_KEY}}'
# Registers its key again when the gateway is reinstalled.
integrates_with:
- capability: model_proxy
rules:
- rule: gateway_key
  with:
    key_env: MU3LAB_AI_KEY
    models: [mu3lab-chat]
    rpm_limit: 3000
mobile:
  primary: surfsense-web
  clients:
  - id: surfsense-web
    name: SurfSense mobile web
    kind: web
    support: official
    platforms:
    - ios
    - android
    - web
    install: {}
    homepage: https://github.com/MODSetter/SurfSense
    setup: web
    summary: SurfSense has a responsive web interface but no confirmed native app or installable PWA.
    steps:
    - Connect the phone to your Mu3Lab tailnet.
    - Open the private SurfSense URL in the phone browser.
    - Sign in with Authentik; SurfSense opens with no second login.
resource_guidance: One container of about 5 GB. It parses documents and runs its built-in search model on the
  processor, using about 0.5 GB of memory while idle and more while it reads new sources.
setup_action: Install SurfSense; Authentik signs you in and the household shares one library.
