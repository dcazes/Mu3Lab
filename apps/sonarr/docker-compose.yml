name: mu3lab-sonarr

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
    restart: unless-stopped
    ports: ["127.0.0.1:8989:8989"]
    environment:
      TZ: ${TZ:-UTC}
      # www-data, as Nextcloud and qBittorrent write the media libraries.
      PUID: "33"
      PGID: "33"
      UMASK: "002"
      # Authentik guards the private address, so Sonarr skips its own login ("External").
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: Enabled
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
      SONARR__LOG__ANALYTICSENABLED: "False"
      # Updates come with Mu3Lab's approved versions, never from inside the app.
      SONARR__UPDATE__MECHANISM: Docker
      SONARR__UPDATE__AUTOMATICALLY: "False"
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/sonarr/config:/config
      # The whole media root, as qBittorrent has it: a finished episode moves from Downloads to
      # Shows instantly (same drive), and the paths both apps see are the same.
      - ${MU3LAB_MEDIA_ROOT:?MU3LAB_MEDIA_ROOT is required}:/media
    networks:
      default: {}
      # qBittorrent's own network, where it skips its login (it is installed first: depends_on).
      qbittorrent: {}
      # Prowlarr and Seerr reach Sonarr here.
      mu3lab_media:
        aliases: [sonarr]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      timeout: 5s
      start_period: 120s
      start_interval: 5s
      interval: 5m
      retries: 3

  # Recyclarr applies the quality rules in recyclarr.yml (TRaSH Guides at a commit Mu3Lab approved,
  # recyclarr-settings.yml): once Sonarr answers at every start (hooks.py), then weekly on its own
  # schedule, which puts back anything changed by hand. It has no web page.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      CRON_SCHEDULE: "@weekly"
      SONARR_API_KEY: ${SONARR_API_KEY:?SONARR_API_KEY is required}
    volumes:
      # Its downloaded copy of TRaSH Guides and its logs.
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/sonarr/recyclarr:/config
      - ./recyclarr.yml:/config/recyclarr.yml:ro
      - ./recyclarr-settings.yml:/config/settings.yml:ro
    # Its own network only: it reaches Sonarr by name there, and GitHub for TRaSH Guides.
    networks:
      default: {}
    depends_on:
      recyclarr-init:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # Recyclarr runs as its image's own user (1000); its folder must be that user's.
  recyclarr-init:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/config"]
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/sonarr/recyclarr:/config
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]

networks:
  # Its own network, with internet access for show details and the sites' feeds.
  default: {}
  qbittorrent:
    name: mu3lab-qbittorrent_default
    external: true
  mu3lab_media: {external: true}
