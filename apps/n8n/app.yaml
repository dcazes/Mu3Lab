# n8n — see ctl/manifest/models.py for every field.
# Administrators only: workflows can run code and reach other Mu3Lab apps' internal APIs.
# Single sign-on is a paid n8n feature, so Authentik guards the address and n8n keeps its own
# login, created by Mu3Lab and saved to the owner's vault (hooks.py).
id: n8n
capabilities: [automation]
name: n8n
tier: optional
group: apps
category: automation
tagline: Automations that connect your apps
summary: Build workflows that connect apps and services, from your Mu3Lab apps to outside ones, run on a schedule or
  when something happens. Administrators only, because workflows can run code and reach other apps.
widgets:
- id: automations
  title: Automations
  description: How many workflows are switched on, and which runs failed in the last day.
  audience: operators
  refresh_seconds: 300
  key:
    label: n8n API key
    help: In n8n, open Settings, then n8n API, and create an API key (no expiry, or a long one). Copy it here.
  largest: [12, 10]
  start: [4, 4]
version: "n8n@2.48.5"  # the upstream release tag
upstream: n8n-io/n8n
service:
  local_port: 5678
  health:
    path: /healthz/readiness
  start_timeout_seconds: 600
  stop_warning: While n8n is stopped, its workflows do not run and its webhooks do not answer.
route:
  https_port: 8466
  caddy_port: 19484
  access: gate
  audience: operators
  # Webhooks and forms answer devices and people on the tailnet without an Authentik sign-in, so phones,
  # scripts and household members (forms) can use them. Nothing is public. n8n itself checks each one:
  # give every Webhook node Header Auth or Basic Auth, and forms a password, or anyone on the tailnet can call it.
  token_bypass:
    path: /webhook* /form*
    header: ''
    header_prefix: ''
sign_in:
  method: gate
  note: Authentik admits administrators only. n8n then asks for its own login, which Mu3Lab created for you and saved
    to your vault, so Bitwarden fills it in.
account:
  mode: api_bootstrap
  save_login_to_vault: true
  user_action: Open n8n; Authentik admits you, and Bitwarden fills in n8n's own login from your vault.
secrets:
- env: N8N_ENCRYPTION_KEY
  length: 48
- env: N8N_DB_PASSWORD
  length: 32
- env: N8N_RUNNERS_AUTH_TOKEN
  length: 48
env:
  N8N_HOST: '{{dns_name}}'
  N8N_PUBLIC_URL: '{{public_url}}'
resource_guidance: Moderate; about 500 MB of memory with its database and Code-node runner. Run history is kept for two
  weeks.
setup_action: Install n8n to automate work between your apps.
mobile:
  primary: n8n-web
  clients:
  - id: n8n-web
    name: n8n editor
    kind: web
    support: official
    platforms:
    - web
    install: {}
    homepage: https://n8n.io/
    setup: web
    summary: Build and watch workflows in a computer's browser; phones can open it, but the editor needs a big screen.
    fallback: true
    steps:
    - Open the private n8n address on a computer connected to the Mu3Lab tailnet.
    - Authentik admits you as an administrator; Bitwarden fills in n8n's login.
    - Webhook addresses n8n shows work from any device on the tailnet, with the authentication you give each one.
