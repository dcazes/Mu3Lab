name: mu3lab-speaches

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    restart: unless-stopped
    ports: ["127.0.0.1:8092:8000"]
    environment:
      # The web UI lets you try models and voices directly. It is served on the local port only.
      ENABLE_UI: "true"
      LOG_LEVEL: info
      # Free memory (graphics memory too) after five idle minutes; Speaches loads again on demand.
      STT_MODEL_TTL: "300"
      TTS_MODEL_TTL: "300"
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/speaches/models:/home/ubuntu/.cache/huggingface/hub
    depends_on:
      models-init: {condition: service_completed_successfully}
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [speaches]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      timeout: 8s
      start_period: 330s
      start_interval: 15s
      interval: 5m
      retries: 3

  # The image runs as "ubuntu" (1000); a folder Docker creates belongs to root.
  models-init:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "-R", "ubuntu:ubuntu", "/models"]
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/speaches/models:/models
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
