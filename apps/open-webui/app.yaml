# Open WebUI — see ctl/manifest/models.py for every field.
id: open-webui
capabilities: [chat]
name: Open WebUI
tier: core
group: ai
category: ai
tagline: AI chat with your apps, voice and documents
summary: Mu3Lab's chat. Chat with Mu3Lab's models, use an assistant for each of your apps, talk and listen with
  local voice when Speech is installed, and ask questions about your own documents.
version: v0.11.4
upstream: open-webui/open-webui
depends_on:
- litellm
service:
  local_port: 3212
  health:
    path: /health
  start_timeout_seconds: 600
route:
  https_port: 8471
  caddy_port: 19488
  access: open
sign_in:
  method: oidc
  oidc:
    client_id: mu3lab-open-webui
    redirect_paths:
    - /oauth/oidc/callback
    launch_path: /oauth/oidc/login
    env:
      client_id: OPEN_WEBUI_OIDC_CLIENT_ID
      client_secret: OPEN_WEBUI_OIDC_CLIENT_SECRET
      discovery_url: OPEN_WEBUI_OIDC_DISCOVERY_URL
account:
  mode: oidc_first_login
  user_action: Open Open WebUI; Authentik signs you in as its administrator.
secrets:
- env: OPEN_WEBUI_SECRET_KEY
  length: 48
# Mu3Lab's own administrator key: it adds each operator's app assistants (ctl/openwebui_ops.py).
- env: OPEN_WEBUI_ADMIN_API_KEY
  length: 48
# The value of its own AI gateway key (gateway_key rule); LiteLLM keys start with sk-.
- env: LITELLM_APP_KEY
  kind: hex
  length: 24
env:
  OPEN_WEBUI_URL: '{{public_url}}'
  MU3LAB_LLM_API_KEY: 'sk-{{LITELLM_APP_KEY}}'
# Registers its key again when the gateway is reinstalled.
integrates_with:
- capability: model_proxy
rules:
# Its own AI gateway key, for chat and document search only: never the voice assistant's route.
- rule: gateway_key
  with:
    key_env: MU3LAB_LLM_API_KEY
    models: [mu3lab-chat, mu3lab-fast, mu3lab-local, mu3lab-embed]
    rpm_limit: 3000
# Before anyone can sign in, the owner's administrator account is created already
# linked to their Authentik sign-in, so no one else can become the first user.
- rule: container_script
  with:
    at: after_healthy
    service: open-webui
    script: scripts/adopt-owner.py
    interpreter:
    - python3
    - '-'
    args:
    - '{{owner_json}}'
    expect: MU3LAB_OPEN_WEBUI_OWNER_OK
    needs_owner: true
    purpose: Make your Authentik account Open WebUI's administrator and register Mu3Lab's assistant key
mobile:
  primary: open-webui-pwa
  clients:
  - id: open-webui-pwa
    name: Open WebUI web app
    kind: pwa
    support: official
    platforms:
    - ios
    - android
    - web
    install: {}
    homepage: https://openwebui.com/
    source: https://github.com/open-webui/open-webui
    setup: pwa
    summary: Chat and talk with your AI models from the phone's home screen.
    caveat: Your phone must be connected to the Mu3Lab tailnet. Voice needs microphone permission in the browser.
    fallback: true
    steps:
    - Connect your phone to the Mu3Lab tailnet.
    - Open the private Open WebUI address; Authentik signs you in.
    - Use the browser's share or menu button and choose Add to Home Screen.
chat:
  workspace: open_webui
resource_guidance: Moderate; a few hundred MB of memory. Models run through LiteLLM, voice through Speech.
setup_action: Connect Open WebUI to LiteLLM, sign in with Authentik, and add an assistant for each app.
