name: mu3lab-open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    extra_hosts: ["${MU3LAB_TAILNET_HOST:-tailnet.invalid}:host-gateway"]
    restart: unless-stopped
    ports: ["127.0.0.1:3212:8080"]
    environment:
      WEBUI_URL: ${OPEN_WEBUI_URL:?OPEN_WEBUI_URL is required}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?OPEN_WEBUI_SECRET_KEY is required}
      # Mu3Lab's settings always win over values Open WebUI saved earlier.
      ENABLE_PERSISTENT_CONFIG: "false"
      # Authentik is the only way in.
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_AUTO_REDIRECT: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_CLIENT_ID: ${OPEN_WEBUI_OIDC_CLIENT_ID:?OPEN_WEBUI_OIDC_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${OPEN_WEBUI_OIDC_CLIENT_SECRET:?OPEN_WEBUI_OIDC_CLIENT_SECRET is required}
      OPENID_PROVIDER_URL: ${OPEN_WEBUI_OIDC_DISCOVERY_URL:?OPEN_WEBUI_OIDC_DISCOVERY_URL is required}
      OAUTH_PROVIDER_NAME: Mu3Lab
      # offline_access: a refresh token, so app tools keep acting as the signed-in person (ContextForge).
      OAUTH_SCOPES: openid email profile offline_access
      # Mu3Lab operators are administrators; everyone else in the household is a user.
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: mu3lab-operators
      OAUTH_ALLOWED_ROLES: mu3lab-users,mu3lab-operators
      DEFAULT_USER_ROLE: user
      # Models come only from LiteLLM, which also routes the local model (mu3lab-local) and local only.
      # Open WebUI's own key reaches chat and document search only (gateway_key in app.yaml).
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${MU3LAB_LLM_API_KEY:?MU3LAB_LLM_API_KEY is required}
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${MU3LAB_LLM_API_KEY:?MU3LAB_LLM_API_KEY is required}
      RAG_EMBEDDING_MODEL: mu3lab-embed
      # Voice in chat: Open WebUI's own Whisper turns speech into text on this server, in any browser,
      # and replies are read aloud with the browser's voices. It never depends on the Speech app.
      AUDIO_STT_ENGINE: ""
      WHISPER_MODEL: small
      AUDIO_TTS_ENGINE: ""
      # Mu3Lab adds each operator's app assistants with its own administrator key; each
      # person's tool connections and assistants are private to them, administrators included.
      ENABLE_API_KEYS: "true"
      BYPASS_ADMIN_ACCESS_CONTROL: "false"
      MU3LAB_ADMIN_API_KEY: ${OPEN_WEBUI_ADMIN_API_KEY:?OPEN_WEBUI_ADMIN_API_KEY is required}
      # Every new chat starts with Mu3Lab's main assistant (ctl/integrations/openwebui.py), listed first;
      # people reach an app's assistant from the model menu or by typing @ and its name.
      DEFAULT_MODELS: mu3lab-assistant
      DEFAULT_PINNED_MODELS: mu3lab-assistant
      MODEL_ORDER_LIST: '["mu3lab-assistant"]'
      # One calendar per person, Mu3Lab's (ctl/calendar_tools.py): Open WebUI's own calendar and its
      # built-in calendar tools would be a second one that nothing else sees.
      ENABLE_CALENDAR: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/open-webui:/app/backend/data
    # mu3lab_mcp: app tools, through ContextForge.
    networks: [mu3lab_frontend, mu3lab_backend, mu3lab_mcp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      timeout: 5s
      start_period: 510s
      start_interval: 15s
      interval: 5m
      retries: 3

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
  mu3lab_mcp: {external: true}
