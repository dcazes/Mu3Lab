name: mu3lab-lobehub

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  app:
    image: lobehub/lobehub:2.2.18@sha256:b7c843911259c54c92f03864d9dd2e9099e18525de1d37498b64cc15751d087d
    restart: unless-stopped
    env_file: ["${MU3LAB_ENV_FILE:-.env}"]
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      INTERNAL_APP_URL: http://app:3210
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/lobehub
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: lobehub
      REDIS_TLS: "0"
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_BUCKET: lobe
      S3_ENABLE_PATH_STYLE: "1"
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      S3_SET_ACL: "0"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET:?KEY_VAULTS_SECRET is required}
      AUTH_SSO_PROVIDERS: authentik
      AUTH_AUTHENTIK_ID: ${AUTH_AUTHENTIK_ID:?AUTH_AUTHENTIK_ID is required}
      AUTH_AUTHENTIK_SECRET: ${AUTH_AUTHENTIK_SECRET:?AUTH_AUTHENTIK_SECRET is required}
      AUTH_AUTHENTIK_ISSUER: ${AUTH_AUTHENTIK_ISSUER:?AUTH_AUTHENTIK_ISSUER is required}
      AUTH_DISABLE_EMAIL_PASSWORD: "1"
      ENABLED_OPENAI: "1"
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      OPENAI_PROXY_URL: http://litellm:4000/v1
      OPENAI_MODEL_LIST: -all,+mu3lab-chat
      DEFAULT_AGENT_CONFIG: model=mu3lab-chat;provider=openai
      FEATURE_FLAGS: -provider_settings,-openai_api_key,-openai_proxy_url,-api_key_manage
      ENABLE_AGENT_GATEWAY: "0"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rustfs: {condition: service_healthy}
      rustfs-init: {condition: service_completed_successfully}
    networks: [mu3lab_frontend, mu3lab_mcp, lobehub_internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/',{redirect:'manual'}).then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    logging: *default-logging

  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports: ["127.0.0.1:3211:3211"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      app: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    networks: [mu3lab_frontend, lobehub_internal]
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  postgres:
    image: paradedb/paradedb:0.25.9-pg17@sha256:8da5d202fe31875af32a49e802ce17cfbc146b0672306f4109809efee1e6f916
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      POSTGRES_DB: lobehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/lobehub/postgres:/var/lib/postgresql/data"]
    networks: [lobehub_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -d lobehub"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging

  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/lobehub/redis:/data"]
    networks: [lobehub_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    command: ["--access-key", "${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}", "--secret-key", "${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}", "/data"]
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/lobehub/object-store:/data"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
    networks: [lobehub_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  storage-init:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 10001:10001 /data"]
    volumes: ["${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/lobehub/object-store:/data"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    logging: *default-logging

  rustfs-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    restart: "no"
    depends_on:
      rustfs: {condition: service_healthy}
    volumes: ["./bucket.config.json:/bucket.config.json:ro"]
    entrypoint: /bin/sh
    command: ["-c", "rc alias set storage http://rustfs:9000 \"${RUSTFS_ACCESS_KEY}\" \"${RUSTFS_SECRET_KEY}\" && rc mb storage/lobe --ignore-existing && rc anonymous set-json /bucket.config.json storage/lobe"]
    networks: [lobehub_internal]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

networks:
  mu3lab_frontend: {external: true}
  mu3lab_mcp: {external: true}
  lobehub_internal: {internal: true}
