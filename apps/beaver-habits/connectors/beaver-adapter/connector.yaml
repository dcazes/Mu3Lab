# Reviewed chat connector — see Connector in ctl/manifest/models.py.
# Beaver Habits has no MCP server; Mu3Lab's small adapter calls its REST API (/api/v1).
id: beaver-adapter
name: Beaver Habits MCP
preferred: true
# Habit lists are private: everyone gets their own copy, acting as them (ctl/person_connectors.py).
per_person: true
provenance: mu3lab-adapter
repository: https://github.com/daya0576/beaverhabits
revision: v0.10.0-api
transport: streamable-http
endpoint: http://beaver-habits-mcp:8080/mcp
local_health: http://127.0.0.1:8825/health
credentials:
- key: api_token
  env: BEAVER_API_TOKEN
  type: secret
  label: Beaver Habits API token
  required: true
provision:
  service: beaver
  script: provision.py
  interpreter:
  - python
  - '-'
  owner_email: true
provision_note: Uses each person's Beaver Habits API token (Settings, API tokens), creating it if they have none.
review_note: Mu3Lab adapter with three tools, listing habits, listing the days one was done and marking a day done or
  not done, for the owner's own habit list. Everyone in the household shares the assistant, so switching it on shares
  the owner's habits with them.
secrets:
- env: MCP_AUTH_TOKEN
  length: 40
include:
- platform/mcp-adapter/server.py
