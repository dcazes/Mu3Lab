name: mu3lab-mealie

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
    extra_hosts: ["${MU3LAB_TAILNET_HOST:-tailnet.invalid}:host-gateway"]
    restart: unless-stopped
    ports: ["127.0.0.1:9925:9000"]
    environment:
      BASE_URL: ${MEALIE_BASE_URL:-http://127.0.0.1:9925}
      ALLOW_SIGNUP: ${MEALIE_ALLOW_SIGNUP:-false}
      TZ: ${TZ:-UTC}
      OIDC_AUTH_ENABLED: ${MEALIE_OIDC_ENABLED:-true}
      OIDC_SIGNUP_ENABLED: ${MEALIE_OIDC_SIGNUP_ENABLED:-true}
      OIDC_CONFIGURATION_URL: ${MEALIE_OIDC_CONFIGURATION_URL:-}
      OIDC_CLIENT_ID: ${MEALIE_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${MEALIE_OIDC_ADMIN_GROUP:-mu3lab-operators}
      OIDC_USER_GROUP: ${MEALIE_OIDC_USER_GROUP:-mu3lab-users}
      OIDC_AUTO_REDIRECT: ${MEALIE_OIDC_AUTO_REDIRECT:-true}
      OIDC_REMEMBER_ME: ${MEALIE_OIDC_REMEMBER_ME:-true}
      ALLOW_PASSWORD_LOGIN: ${MEALIE_ALLOW_PASSWORD_LOGIN:-false}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/mealie:/app/data
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [mealie-app]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/app/about', timeout=5)"]
      timeout: 8s
      start_period: 330s
      start_interval: 15s
      interval: 5m
      retries: 3

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
