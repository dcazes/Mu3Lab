name: mu3lab-mcp-paperless
services:
  paperless-mcp:
    image: node:22.19.0-alpine3.22
    restart: "no"
    command: ["npx", "-y", "paperless-ngx-mcp@3.1.1", "--http", "--port", "3000"]
    environment:
      PAPERLESS_URL: http://paperless-webserver:8000
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-}
      PAPERLESS_API_KEY: ${PAPERLESS_API_KEY:?PAPERLESS_API_KEY is required}
      PAPERLESS_MAX_SESSIONS: "10"
    ports: ["127.0.0.1:8816:3000"]
    networks: [mu3lab_backend, mu3lab_mcp]
    security_opt: [no-new-privileges:true]
networks:
  mu3lab_backend: {external: true}
  mu3lab_mcp: {external: true}
