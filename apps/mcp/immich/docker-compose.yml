name: mu3lab-mcp-immich
services:
  immich-mcp:
    image: ghcr.io/barryw/immichmcp:v3.3.3
    restart: unless-stopped
    environment:
      IMMICH_BASE_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:?IMMICH_API_KEY is required}
      IMMICH_TOOL_MODE: gateway
      MCP_PORT: "5000"
    ports: ["127.0.0.1:8815:5000"]
    networks: [mu3lab_backend, mu3lab_mcp]
    security_opt: [no-new-privileges:true]
networks:
  mu3lab_backend: {external: true}
  mu3lab_mcp: {external: true}
