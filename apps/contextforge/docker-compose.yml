name: mu3lab-contextforge

services:
  contextforge:
    image: ghcr.io/ibm/mcp-context-forge:v1.0.11@sha256:e9639c030162d6cb2f9f188600dd69af8091ec62a7ce307d4a74f4d4f86873df
    # Containers resolve this server's private name to the tailnet relay (Authentik's sign-in keys),
    # and host.docker.internal to this computer, where Kopia's read-only chat connector listens.
    extra_hosts:
      - "${MU3LAB_TAILNET_HOST:-tailnet.invalid}:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports: ["127.0.0.1:4444:4444"]
    environment:
      HOST: 0.0.0.0
      PORT: "4444"
      ENVIRONMENT: production
      APP_DOMAIN: ${CONTEXTFORGE_URL:?CONTEXTFORGE_URL is required}
      ALLOWED_ORIGINS: ${CONTEXTFORGE_ORIGINS:?CONTEXTFORGE_ORIGINS is required}
      DATABASE_URL: postgresql+psycopg://contextforge:${CONTEXTFORGE_DB_PASSWORD:?CONTEXTFORGE_DB_PASSWORD is required}@db:5432/contextforge
      # No Redis: one worker host, caches live in the database.
      CACHE_TYPE: database
      # The default starts one worker per CPU (up to 16, ~2 GB idle); two is plenty for a home lab.
      GUNICORN_WORKERS: "2"
      JWT_SECRET_KEY: ${CONTEXTFORGE_JWT_SECRET:?CONTEXTFORGE_JWT_SECRET is required}
      AUTH_ENCRYPTION_SECRET: ${CONTEXTFORGE_AUTH_ENCRYPTION_SECRET:?CONTEXTFORGE_AUTH_ENCRYPTION_SECRET is required}
      BASIC_AUTH_USER: mu3lab
      BASIC_AUTH_PASSWORD: ${CONTEXTFORGE_BASIC_AUTH_PASSWORD:?CONTEXTFORGE_BASIC_AUTH_PASSWORD is required}
      # Mu3Lab's own administrator account (ctl/contextforge.py); people sign in through Authentik.
      PLATFORM_ADMIN_EMAIL: mu3lab@contextforge.example.com
      PLATFORM_ADMIN_PASSWORD: ${CONTEXTFORGE_ADMIN_PASSWORD:?CONTEXTFORGE_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_FULL_NAME: Mu3Lab
      DEFAULT_USER_PASSWORD: ${CONTEXTFORGE_DEFAULT_USER_PASSWORD:?CONTEXTFORGE_DEFAULT_USER_PASSWORD is required}
      # Every call, including chat's MCP connections, needs a signed-in person or a key.
      AUTH_REQUIRED: "true"
      MCP_CLIENT_AUTH_ENABLED: "true"
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      SECURE_COOKIES: "true"
      # Authentik is the only way in for people. Operators become ContextForge administrators.
      SSO_ENABLED: "true"
      SSO_PRESERVE_ADMIN_AUTH: "true"
      SSO_AUTO_CREATE_USERS: "true"
      # Two Mu3Lab providers (these screens, and sign-ins Open WebUI passes on) are the same Authentik.
      SSO_ALLOW_PROVIDER_LINKING: "true"
      SSO_GENERIC_ENABLED: "true"
      SSO_GENERIC_PROVIDER_ID: mu3lab
      SSO_GENERIC_DISPLAY_NAME: Mu3Lab
      SSO_GENERIC_CLIENT_ID: ${CONTEXTFORGE_OIDC_CLIENT_ID:?CONTEXTFORGE_OIDC_CLIENT_ID is required}
      SSO_GENERIC_CLIENT_SECRET: ${CONTEXTFORGE_OIDC_CLIENT_SECRET:?CONTEXTFORGE_OIDC_CLIENT_SECRET is required}
      SSO_GENERIC_AUTHORIZATION_URL: ${CONTEXTFORGE_OIDC_AUTHORIZE:?CONTEXTFORGE_OIDC_AUTHORIZE is required}
      SSO_GENERIC_TOKEN_URL: ${CONTEXTFORGE_OIDC_TOKEN:?CONTEXTFORGE_OIDC_TOKEN is required}
      SSO_GENERIC_USERINFO_URL: ${CONTEXTFORGE_OIDC_USERINFO:?CONTEXTFORGE_OIDC_USERINFO is required}
      SSO_GENERIC_ISSUER: ${CONTEXTFORGE_OIDC_ISSUER:?CONTEXTFORGE_OIDC_ISSUER is required}
      SSO_GENERIC_JWKS_URI: ${CONTEXTFORGE_OIDC_JWKS:?CONTEXTFORGE_OIDC_JWKS is required}
      SSO_GENERIC_SCOPE: openid profile email
      SSO_GENERIC_GROUPS_CLAIM: groups
      SSO_GENERIC_ADMIN_GROUPS: '["mu3lab-operators"]'
      # Open WebUI passes each person's own Authentik sign-in with their tool calls;
      # Mu3Lab registers that issuer as trusted for API use (ctl/contextforge.py).
      SSO_API_TOKEN_AUTH_ENABLED: "true"
      # Pick up tools a connector adds; they stay off until an operator adds them to a virtual server.
      AUTO_REFRESH_SERVERS: "true"
      MCPGATEWAY_A2A_ENABLED: "false"
      PLUGINS_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
    networks: [mu3lab_mcp, mu3lab_mcp_upstream, contextforge_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4444/health', timeout=5)"]
      timeout: 10s
      start_period: 510s
      start_interval: 5s
      interval: 5m
      retries: 3

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: ${CONTEXTFORGE_DB_PASSWORD:?CONTEXTFORGE_DB_PASSWORD is required}
      POSTGRES_DB: contextforge
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/contextforge/postgres:/var/lib/postgresql/data
    networks: [contextforge_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      timeout: 5s
      start_period: 300s
      start_interval: 5s
      interval: 5m
      retries: 3

networks:
  mu3lab_mcp: {external: true}
  mu3lab_mcp_upstream: {external: true}
  contextforge_internal: {internal: true}
