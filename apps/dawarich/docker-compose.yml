name: mu3lab-dawarich

x-dawarich: &dawarich
  image: freikin/dawarich:1.15.3@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
  extra_hosts: ["${MU3LAB_TAILNET_HOST:-tailnet.invalid}:host-gateway"]
  restart: unless-stopped
  environment: &dawarich-env
    RAILS_ENV: production
    TIME_ZONE: ${TZ:-UTC}
    SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE:?DAWARICH_SECRET_KEY_BASE is required}
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_USERNAME: dawarich
    DATABASE_PASSWORD: ${DAWARICH_DB_PASSWORD:?DAWARICH_DB_PASSWORD is required}
    DATABASE_NAME: dawarich
    REDIS_URL: redis://redis:6379
    # dawarich-app: ContextForge, for chat tools.
    APPLICATION_HOSTS: ${DAWARICH_HOST:?DAWARICH_HOST is required},localhost,127.0.0.1,dawarich-app
    APPLICATION_PROTOCOL: https
    SELF_HOSTED: "true"
    STORE_GEODATA: "true"
    RAILS_LOG_TO_STDOUT: "true"
    # Authentik is the only way in.
    ALLOW_EMAIL_PASSWORD_LOGIN: "false"
    ALLOW_EMAIL_PASSWORD_REGISTRATION: "false"
    OIDC_CLIENT_ID: ${DAWARICH_OIDC_CLIENT_ID:?DAWARICH_OIDC_CLIENT_ID is required}
    OIDC_CLIENT_SECRET: ${DAWARICH_OIDC_CLIENT_SECRET:?DAWARICH_OIDC_CLIENT_SECRET is required}
    OIDC_ISSUER: ${DAWARICH_OIDC_ISSUER:?DAWARICH_OIDC_ISSUER is required}
    OIDC_REDIRECT_URI: ${DAWARICH_OIDC_REDIRECT_URI:?DAWARICH_OIDC_REDIRECT_URI is required}
    OIDC_PROVIDER_NAME: Mu3Lab
    OIDC_AUTO_REGISTER: "true"
    # Place names come only from the Photon below, never a public map service.
    PHOTON_API_HOST: photon:2322
    PHOTON_API_USE_HTTPS: "false"
  volumes:
    - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich/storage:/var/app/storage
    - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich/public:/var/app/public
    - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich/watched:/var/app/tmp/imports/watched
  security_opt: ["no-new-privileges:true"]

services:
  app:
    <<: *dawarich
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    ports: ["127.0.0.1:3006:3000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      mu3lab_frontend:
      mu3lab_backend:
      dawarich_internal:
      # ContextForge calls Dawarich's own MCP server (/api/v1/mcp) for chat.
      mu3lab_mcp_upstream:
        aliases: [dawarich-app]
    healthcheck:
      test: ["CMD-SHELL", "wget --header='X-Forwarded-Proto: https' -qO- http://127.0.0.1:3000/api/v1/health | grep -q '\"ok\"'"]
      timeout: 10s
      start_period: 570s
      start_interval: 15s
      interval: 5m
      retries: 3

  sidekiq:
    <<: *dawarich
    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]
    environment:
      <<: *dawarich-env
      BACKGROUND_PROCESSING_CONCURRENCY: "3"
    depends_on:
      app: {condition: service_healthy}
    networks: [mu3lab_frontend, mu3lab_backend, dawarich_internal]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      timeout: 10s
      start_period: 510s
      start_interval: 15s
      interval: 5m
      retries: 3

  db:
    image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DB_PASSWORD:?DAWARICH_DB_PASSWORD is required}
      POSTGRES_DB: dawarich
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich/postgres:/var/lib/postgresql/data
    networks: [dawarich_internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawarich -d dawarich"]
      timeout: 5s
      start_period: 300s
      start_interval: 10s
      interval: 5m
      retries: 3

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--save", "900", "1", "--appendonly", "no"]
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich/redis:/data
    networks: [dawarich_internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      start_period: 300s
      start_interval: 10s
      interval: 5m
      retries: 3

  # Photon, the private address lookup that comes with Dawarich. Its first start
  # downloads the map index (about 5 GB for Canada), so it has no health check:
  # installing or starting Dawarich must not wait an hour for it.
  photon:
    image: rtuszik/photon-docker:2.4.0@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
    restart: unless-stopped
    environment:
      REGION: ${PHOTON_REGION:?PHOTON_REGION is required}
      IMPORT_MODE: db
      # Official GraphHopper downloads, verified by their MD5 files.
      BASE_URL: https://download1.graphhopper.com/public/
      UPDATE_STRATEGY: PARALLEL
      UPDATE_INTERVAL: 90d
      LOG_LEVEL: INFO
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/dawarich-photon:/photon/data
    # Frontend for downloading the index; internal so only Dawarich can ask it.
    networks:
      mu3lab_frontend: {}
      dawarich_internal:
        aliases: [photon]
    security_opt: ["no-new-privileges:true"]
    healthcheck: {disable: true}  # the image ships one; see above

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
  mu3lab_mcp_upstream: {external: true}
  dawarich_internal: {internal: true}
