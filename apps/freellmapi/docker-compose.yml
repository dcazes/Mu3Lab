name: mu3lab-freellmapi

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.19@sha256:22fb2364a629c72b735c802942366ab2d737fa72e84b74f16fbd72715186e5e1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    env_file: [".env"]
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/freellmapi:/app/server/data
      - ./freellmapi.config.json:/mu3lab/config/freellmapi.config.json:ro
    networks: [mu3lab_frontend, mu3lab_backend]
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      timeout: 10s
      start_period: 840s
      start_interval: 5s
      interval: 5m
      retries: 3

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
