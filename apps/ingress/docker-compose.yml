# Caddy: the one loopback entry point. Tailscale Serve forwards each private
# HTTPS port to a Caddy listener here; Caddy routes it to the app.
name: mu3lab-ingress

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    network_mode: host
    environment:
      MU3LAB_INGRESS_TOKEN: ${MU3LAB_INGRESS_TOKEN:?MU3LAB_INGRESS_TOKEN is required}
    # App logins Caddy adds after Authentik admits someone (ctl/routes.py, upstream_basic_auth).
    env_file:
      - path: ${MU3LAB_INGRESS_SECRETS:-/dev/null}
        required: false
    volumes:
      - ${MU3LAB_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      timeout: 10s
      start_period: 90s
      start_interval: 30s
      interval: 5m
      retries: 3

volumes:
  caddy-data:
  caddy-config:
