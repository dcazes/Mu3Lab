# Ollama — see ctl/manifest/models.py for every field.
id: ollama
capabilities: [model_runner]
name: Ollama
tier: optional
group: ai
category: ai
tagline: A second model runner, without a web app
summary: Runs AI models and generates text embeddings on your server, as an alternative to Unsloth Studio. Once it is
  installed, choose it in Settings > AI to run private chat and document search; it has no browser interface.
version: v0.35.0
upstream: ollama/ollama
model_runner:
  engine: ollama_api
service:
  local_port: 11434
  health:
    path: /
  uses_gpu: true
sign_in:
  method: none
  note: Internal-only model runner (search model and the optional local chat model); no browser or MCP route.
ui:
  available: false
  unavailable_reason: Ollama is an internal model and embedding API; it does not ship a browser UI.
resource_guidance: Model downloads determine disk and memory use.
backup:
  include: false
  reason: Its data is downloaded AI models, which Mu3Lab downloads again when needed.
setup_action: Install a second model runner, then choose it in Settings > AI.
rules:
- rule: needs_embedding_model
  with:
    at: after_healthy
