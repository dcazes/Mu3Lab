# Ollama — see ctl/manifest/models.py for every field.
id: ollama
name: Ollama
tier: core
group: ai
category: ai
tagline: Runs AI models on your server
summary: Runs AI models and generates text embeddings on your server. Mu3Lab uses Ollama as an internal API for
  local inference and document search; it has no browser interface.
version: v0.35.0
upstream: ollama/ollama
service:
  local_port: 11434
  health:
    path: /
  uses_gpu: true
sign_in:
  method: none
  note: Internal-only embedding and tiny-model runner; no browser or MCP route.
ui:
  available: false
  unavailable_reason: Ollama is an internal model and embedding API; it does not ship a browser UI.
resource_guidance: Model downloads determine disk and memory use.
setup_action: Install and verify the model runner using the host-wide compute setting.
rules:
- rule: needs_embedding_model
  with:
    model: nomic-embed-text
    runner: ollama
    at: after_healthy
