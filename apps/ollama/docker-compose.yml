name: mu3lab-ollama

services:
  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # The search model and, if the owner chose one, a local chat model
      # (Settings, AI models). Both may stay loaded so search inside a chat
      # does not reload the chat model; free the GPU for speech and images
      # after ten idle minutes.
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Room for long conversations and the assistants' instructions (Ollama's own default is
      # 4,096 tokens); a model trained on less uses its own maximum. The memory estimates in
      # ctl/local_models.py assume this length and the cache below.
      OLLAMA_CONTEXT_LENGTH: "51200"
      # The conversation cache in 8 bits instead of 16: about half its memory, with no
      # noticeable change in answers. It needs flash attention, which is also faster.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/ollama:/root/.ollama
    networks: [mu3lab_frontend, mu3lab_backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      timeout: 10s
      start_period: 200s
      start_interval: 20s
      interval: 5m
      retries: 3

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
