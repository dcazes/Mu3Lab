name: mu3lab-ollama

services:
  ollama:
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Ollama only serves the small embedding model; free the GPU for speech
      # and images after ten idle minutes.
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/ollama:/root/.ollama
    networks: [mu3lab_frontend, mu3lab_backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
