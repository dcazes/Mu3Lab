# LiveKit voice assistant — see ctl/manifest/models.py for every field.
# One app, four containers: the LiveKit server, the voice agent, the voice page people
# talk on, and LiveKit's admin dashboard. Everything runs on this server; the agent
# reaches the chat model and speech through LiteLLM with a key of its own.
id: livekit
capabilities: [voice_assistant]
name: Voice assistant
tier: optional
group: ai
category: ai
tagline: Talk to your private AI assistant
summary: A voice assistant you talk to in the browser. Your speech is turned into text by Whisper and read back by a
  natural voice, both on this server. The answer comes from the model chosen in Settings, Voice Assistant, which can be
  a local model or your outside providers. Built on LiveKit, with its admin dashboard for checking that the assistant
  is connected.
version: v1.13.10
upstream: livekit/livekit
depends_on:
- litellm
- speaches
service:
  # The voice page. LiveKit's own ports follow; the health check asks the LiveKit server.
  local_port: 8093
  extra_ports:
  - port: 7880
    purpose: LiveKit signalling and server API
  - port: 8094
    purpose: LiveKit admin dashboard
  # WebRTC media cannot pass through an HTTPS route; these listen on the tailnet address only.
  - port: 7881
    purpose: WebRTC over TCP
    listen: tailnet
  - port: 7882
    purpose: WebRTC media
    protocol: udp
    listen: tailnet
  health:
    path: /
    port: 7880
  # The first install builds three images (agent, voice page, dashboard).
  start_timeout_seconds: 1800
route:
  https_port: 8476
  caddy_port: 19493
  # The voice page hands out LiveKit room tokens, so Authentik admits the household first.
  access: gate
  audience: household
extra_routes:
- name: signal
  label: LiveKit server
  local_port: 7880
  https_port: 8477
  caddy_port: 19494
  # Browsers connect here with the room token the voice page gave them; LiveKit checks it.
  access: open
  link: false
- name: admin
  label: Admin dashboard
  local_port: 8094
  https_port: 8478
  caddy_port: 19495
  access: gate
  audience: operators
  # The dashboard knows only one username and password. Caddy sends them after Authentik
  # admits an administrator, so nobody types them.
  upstream_basic_auth:
    user_env: LIVEKIT_ADMIN_USER
    password_env: LIVEKIT_ADMIN_PASSWORD
sign_in:
  method: gate
  note: Authentik admits the household to the voice page and administrators to the admin dashboard. The dashboard's
    own login is filled in by Mu3Lab, so there is nothing extra to type.
ui:
  label: Talk
  parts:
    server: LiveKit server
    agent: Voice agent
    voice-ui: Voice page
    dashboard: Admin dashboard
backup:
  include: false
  reason: It keeps no data of its own; its settings are generated again on install.
secrets:
- env: LIVEKIT_API_KEY
  kind: hex
  length: 12
- env: LIVEKIT_API_SECRET
  length: 48
- env: LIVEKIT_ADMIN_PASSWORD
  length: 32
- env: LIVEKIT_DASHBOARD_SECRET
  length: 48
- env: VOICE_AGENT_KEY
  kind: hex
  length: 24
env:
  # WebRTC media is published on this address only (see service.extra_ports).
  MU3LAB_TAILNET_IP: '{{tailnet_ip}}'
  # Where browsers reach LiveKit: the signal route, over HTTPS.
  MU3LAB_LIVEKIT_PUBLIC_URL: '{{route_url:signal}}'
  # The agent's own LiteLLM key (gateway_key rule below); LiteLLM keys start with sk-.
  MU3LAB_LLM_API_KEY: 'sk-{{VOICE_AGENT_KEY}}'
  LIVEKIT_ADMIN_USER: admin
integrates_with:
# The voice the speech app reads with.
- capability: speech
  env:
    MU3LAB_TTS_VOICE: '{{provider:MU3LAB_TTS_VOICE}}'
# Registers the agent's key again when the gateway is reinstalled.
- capability: model_proxy
rules:
- rule: gateway_key
  with:
    key_env: MU3LAB_LLM_API_KEY
    models: [mu3lab-voice, mu3lab-stt, mu3lab-tts]
# Start only when the voice model is ready and the models above are routed; otherwise the card says what to open.
- rule: needs_voice_model
  with:
    models: [mu3lab-voice, mu3lab-stt, mu3lab-tts]
resource_guidance: The assistant itself is light (under 1 GB of memory). The speech models and a local voice model
  need about 7 GB of graphics memory together with the 4B model; with outside providers, only speech runs here. Uses
  the model chosen in Settings, Voice Assistant.
setup_action: Install Speech, check the model in Settings, Voice Assistant, then install the voice assistant and
  open Talk.
