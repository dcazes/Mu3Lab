# The voice assistant's full-duplex mode: MiniCPM-o 4.5 (4-bit) and a private web search.
#
# Not an app of its own and never started with LiveKit: only the switch in Settings, Voice
# Assistant starts it (ctl/duplex_voice.py), after stopping every other app that uses the
# graphics card, and stops it again before they start. Docker keeps a stopped container stopped
# across restarts, so the card never holds two models.
name: mu3lab-livekit-duplex

services:
  # Listens and speaks at the same time. One call at a time; the model loads on the first call
  # (Mu3Lab makes that call when the mode is switched on) and stays on the card.
  omni:
    build: .
    image: mu3lab/minicpm-omni:local
    restart: unless-stopped
    command:
      - --port
      - "9060"
      - -m
      - /models/MiniCPM-o-4_5-Q4_K_M.gguf
      - -ngl
      - "99"
      - --ctx-size
      - "8192"
    volumes:
      - ${MU3LAB_DUPLEX_MODELS:?MU3LAB_DUPLEX_MODELS is required}:/models:ro
    tmpfs:
      # Each call's audio passes through here.
      - /tmp:size=512m,uid=1000,gid=1000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Only the voice agent talks to it.
    networks:
      mu3lab_backend:
        aliases: [minicpm-omni]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9060/health"]
      interval: 1m
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

  # The model's one tool: a private metasearch the agent asks, so searches leave from this server
  # without an account or key. The frontend network reaches the internet; the backend reaches the agent.
  searxng:
    image: searxng/searxng:2026.3.13-3c1f68c59@sha256:174f6a8498d88d2d98c265a952c2d552859bf315cd505746d1c0d4fbec37952f
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required}
      SEARXNG_BASE_URL: http://voice-search:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [voice-search]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      timeout: 5s
      start_period: 120s
      start_interval: 10s
      interval: 5m
      retries: 3

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
