[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mu3lab-voice-agent"
version = "1.0.0"
description = "Local voice assistant for Mu3Lab, built on LiveKit Agents"
requires-python = ">=3.10, <3.15"

dependencies = [
    # openai: the STT, TTS and LLM plugins, pointed at Mu3Lab's own gateway (LiteLLM) and speech service.
    "livekit-agents[openai]~=1.8.8",
    # Silero: local voice activity detection. Without it the agent asks LiveKit Cloud for one.
    "livekit-plugins-silero~=1.8.8",
    "python-dotenv",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
