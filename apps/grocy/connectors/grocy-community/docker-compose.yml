name: mu3lab-mcp-grocy
services:
  grocy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    environment:
      GROCY_BASE_URL: http://grocy-app:80
      GROCY_API_KEY: ${GROCY_API_KEY:?GROCY_API_KEY is required}
      ENABLE_HTTP_SERVER: 'true'
      MCP_HTTP_TRANSPORT_ONLY: 'true'
      HTTP_SERVER_PORT: '8080'
      SERIALIZE_STRUCTURED_TO_CONTENT: 'true'
      GROCY_ENABLE_DEV_TOOLS: 'false'
    ports:
    - 127.0.0.1:8823:8080
    networks:
    - mu3lab_backend
    - mu3lab_mcp_upstream
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    image: ghcr.io/dcazes/mu3lab-grocy-community:development
networks:
  mu3lab_backend:
    external: true
  mu3lab_mcp_upstream:
    external: true
