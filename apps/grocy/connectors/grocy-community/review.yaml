schema_version: 1
server: grocy-community
revision: 2.8.0
reviewed_at: '2026-10-04'
guidance: Use returned product, stock, list, and recipe IDs; never guess IDs or units. Check expiry dates and low
  stock before recommending purchases. Ask before stock transactions, list edits, cooking, or completing chores
  and tasks. Storage locations are distinct from retail shops. Raw API and printing tools are blocked.
categories:
- id: inventory
  title: Stock and products
  summary: Read stock, expiry dates, prices, and product details; record stock transactions.
- id: shopping
  title: Shopping lists
  summary: Read and edit household shopping lists and find retail shops.
- id: recipes
  title: Recipes and meals
  summary: Read recipes and ingredient coverage; plan meals and record cooking.
- id: household
  title: Chores and tasks
  summary: Read chores, tasks, equipment, and batteries; record completed household work.
- id: system
  title: Units and storage
  summary: Read stock storage locations and quantity units.
