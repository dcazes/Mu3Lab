blocked:
  edit_documents_bulk: One call can permanently delete, merge, split or strip pages from many documents; edit documents one at a time instead.
  edit_tags_bulk: Bulk-deletes tags or changes their permissions across the whole library.
  edit_correspondents_bulk: Bulk-deletes correspondents or changes their permissions across the whole library.
  edit_document_types_bulk: Bulk-deletes document types or changes their permissions across the whole library.
  edit_custom_fields_bulk: Bulk-deletes custom fields or changes their permissions across the whole library.
  delete_tag: Permanently removes the tag from every document.
  delete_correspondent: Permanently removes the correspondent from every document.
  delete_document_type: Permanently removes the document type from every document.
  delete_custom_field: Permanently removes the field and its values from every document.
  delete_storage_path: Changes where every affected document is filed.
  empty_trash: Permanently deletes documents; the owner empties the trash in Paperless itself.
  email_document: Sends documents to outside addresses; text inside a document must never be able to trigger that.
  download_document: Returns the raw file as base64; get_document_content gives the text chat can use.
  download_documents_bulk: Returns a base64 ZIP far larger than a chat can hold.
  get_document_thumbnail: Returns a base64 image chat cannot show; read the document text instead.
  get_document_preview: Returns a base64 image chat cannot show; read the document text instead.
