name: mu3lab-paperless-ngx

services:
  broker:
    image: docker.io/valkey/valkey:9.0.1-alpine
    restart: unless-stopped
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/redis:/data
    networks: [paperless_internal]
    security_opt: [no-new-privileges:true]

  db:
    image: docker.io/library/postgres:18.0-alpine
    restart: unless-stopped
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?PAPERLESS_DBPASS is required}
    networks: [paperless_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 10

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?PAPERLESS_DBPASS is required}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY is required}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://127.0.0.1:8000}
      PAPERLESS_TIME_ZONE: ${TZ:-America/Toronto}
      PAPERLESS_APPS: ${PAPERLESS_APPS:-}
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: ${PAPERLESS_SOCIALACCOUNT_PROVIDERS:-{}}
      PAPERLESS_DISABLE_REGULAR_LOGIN: ${PAPERLESS_DISABLE_REGULAR_LOGIN:-false}
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: ${PAPERLESS_REDIRECT_LOGIN_TO_SSO:-false}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/data:/usr/src/paperless/data
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/media:/usr/src/paperless/media
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/export:/usr/src/paperless/export
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/paperless/consume:/usr/src/paperless/consume
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [paperless-webserver]
      paperless_internal: {}
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/"]
      interval: 20s
      timeout: 8s
      retries: 30
      start_period: 60s

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
  paperless_internal: {internal: true}
