# Mu3Lab Authentik identity service. Only Caddy/Tailscale expose it remotely.
# Its data lives under Mu3Lab's data folder so backups include every account.
name: mu3lab-authentik

services:
  postgresql:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/authentik/postgresql:/var/lib/postgresql/data
    networks: [mu3lab_backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    restart: unless-stopped
    command: server
    env_file: ${AUTHENTIK_ENV_FILE:-.env}
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/authentik/media:/media
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/authentik/templates:/templates
    ports: ["127.0.0.1:9001:9000"]
    networks: [mu3lab_frontend, mu3lab_backend]
    depends_on:
      postgresql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 12

  worker:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    restart: unless-stopped
    command: worker
    env_file: ${AUTHENTIK_ENV_FILE:-.env}
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/authentik/media:/media
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/authentik/templates:/templates
    networks: [mu3lab_frontend, mu3lab_backend]
    depends_on:
      postgresql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 12

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
