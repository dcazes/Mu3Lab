# Authentik — see ctl/manifest/models.py for every field.
id: authentik
capabilities: [identity_provider]
name: Authentik
tier: foundation
group: infrastructure
category: system
tagline: Single sign-on for your apps
summary: Manages user accounts and access to Mu3Lab. Authentik provides a shared sign-in for compatible apps and
  an additional sign-in gate for selected services.
version: 2026.8.3
upstream: goauthentik/authentik
service:
  local_port: 9001
  health:
    path: /-/health/ready/
  stoppable: false
  start_timeout_seconds: 600
route:
  https_port: 443
  caddy_port: 19461
  access: open  # its real route is hand-reviewed in apps/ingress/Caddyfile
  generated: false
sign_in:
  method: local
  session_provider: true
setup_action: Create the Authentik administrator and Mu3Lab application.
chat:
  assistant:
    title: Authentik (admins)
    description: Look up who can sign in and recent sign-in activity. Read-only.
    instructions: Help administrators check Mu3Lab's sign-in service. You can only read people, groups and sign-in
      events; to change anyone, point them to the People page in the Mu3Lab dashboard. Use only Authentik tools
      assigned to this agent.
    audience: operators
    faq:
    - question: "How do I add or remove someone?"
      answer: "In the Mu3Lab dashboard: Settings, then People. That creates their account and invite link, or removes their access everywhere."
    - question: "How does someone change their password?"
      answer: "They sign in to Authentik and use Settings, then Change password."
    - question: "How long does a sign-in last?"
      answer: "30 days on each device. Signing out, or being removed, ends it straight away."
  connectors:
  - authentik-reader
