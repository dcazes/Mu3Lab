# Kopia backups — Mu3Lab's backup service — see ctl/manifest/models.py for every field.
# Kopia's own server makes every backup: it runs the household's schedule,
# keeps backups by its retention policy and maintains the repository
# (ctl/backup_service.py). Administrators also open its web page to browse
# backups and restore single files into /srv/mu3lab/backups/restores.
id: kopia-ui
capabilities: [backup_service]
name: Kopia backups
tier: optional
group: infrastructure
category: system
tagline: Makes your backups; browse and restore files
summary: Kopia's own server makes every backup on the schedule you choose and keeps them by its retention policy.
  Administrators can look inside any backup and restore single files or folders into the restores folder.
  Restoring a whole app is done from that app's Backups card.
version: v0.23.1
upstream: kopia/kopia
backup:
  include: false
  reason: It holds no data of its own; it makes the backups.
service:
  local_port: 51515
  health:
    kind: tcp
route:
  https_port: 8470
  caddy_port: 19487
  access: gate
  audience: operators
  forwarded_host: host
  # Caddy signs in to Kopia after Authentik admits an administrator, so nobody types Kopia's password.
  upstream_basic_auth:
    user_env: KOPIA_SERVER_USERNAME
    password_env: KOPIA_SERVER_PASSWORD
sign_in:
  method: gate
  note: Authentik admits administrators only; Mu3Lab then signs in to Kopia for them.
ui:
  label: Open backups
resource_guidance: A small server; it works hardest while a backup runs.
secrets:
- env: KOPIA_SERVER_PASSWORD
  length: 32
# Mu3Lab asks Kopia to back up now and reads each backup's status.
- env: KOPIA_SERVER_CONTROL_PASSWORD
  length: 32
# Kopia's before- and after-actions present this to Mu3Lab; it can only stop and start apps for their backup.
- env: MU3LAB_BACKUP_HOOK_TOKEN
  length: 48
env:
  KOPIA_SERVER_USERNAME: mu3lab-ui
  KOPIA_SERVER_CONTROL_USER: mu3lab-control
rules:
- rule: runs_backups
chat:
  assistant:
    title: Kopia backups (admins)
    description: Check whether each app's backups are running and up to date. Read-only.
    instructions: Help administrators check Mu3Lab's backups. You can only read each app's backup status and the
      backup storage; to back up now, restore or change the schedule, point them to Security & backups in the Mu3Lab
      dashboard. Use only Kopia tools assigned to this agent.
    audience: operators
    faq:
    - question: "When do backups run?"
      answer: "On the schedule set in the Mu3Lab dashboard under Security & backups (weekly, Sunday 03:30, unless someone changed it)."
    - question: "How do I back up now or restore an app?"
      answer: "In the Mu3Lab dashboard: Security & backups, or the app's own Backups card. This assistant can only read backup status."
  connectors:
  - kopia-reader
