# Reviewed chat connector — see Connector in ctl/manifest/models.py.
id: immich-photo-manager
name: Immich Photo Manager
preferred: true
# The app keeps each person's data private: everyone gets their own copy (ctl/person_connectors.py).
per_person: true
provenance: community
repository: https://github.com/drolosoft/immich-photo-manager
revision: 2.0.11
transport: streamable-http
endpoint: http://immich-photo-manager:8626/mcp
local_health: http://127.0.0.1:8815/health
credentials:
- key: api_key
  env: IMMICH_API_KEY
  type: secret
  label: Immich API key
  required: true
provision:
  service: database
  script: provision.sh
  interpreter:
  - sh
  - -s
  owner_email: true
provision_note: Creates a dedicated Mu3Lab MCP API key for the owner's Immich account.
reviewed: true
