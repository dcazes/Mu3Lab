name: mu3lab-immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    extra_hosts: ["${MU3LAB_TAILNET_HOST:-tailnet.invalid}:host-gateway"]
    restart: unless-stopped
    ports: ["127.0.0.1:2283:2283"]
    environment:
      IMMICH_CONFIG_FILE: /config/immich-config.json
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/immich/library:/data
      - ./immich-config.json:/config/immich-config.json:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis: {condition: service_healthy}
      database: {condition: service_healthy}
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [immich-server]
      immich_internal: {}
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2283/api/server/ping').then(r=>{if(!r.ok)process.exit(1)})"]
      timeout: 8s
      start_period: 495s
      start_interval: 15s
      interval: 5m
      retries: 3

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      # Upstream's since 3.4: the revised models, which use less memory and run faster.
      MACHINE_LEARNING_MODEL_REVISION: v2
    volumes: [model-cache:/cache]
    networks: [immich_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:  # the image's own healthcheck.py
      start_period: 300s
      start_interval: 15s
      interval: 5m

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: unless-stopped
    networks: [immich_internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      timeout: 5s
      start_period: 100s
      start_interval: 10s
      interval: 5m
      retries: 3

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks: [immich_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 5s
      start_period: 100s
      start_interval: 10s
      interval: 5m
      retries: 3

volumes:
  model-cache:

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
  immich_internal: {internal: true}
