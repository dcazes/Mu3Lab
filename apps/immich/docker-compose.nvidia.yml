# NVIDIA computers: Immich's own CUDA build runs face recognition and smart search on the GPU
# (docs.immich.app/features/ml-hardware-acceleration), and the server converts videos with the
# card's NVENC encoder (docs.immich.app/features/hardware-transcoding; build_env in app.yaml). Chosen by the compute mode (ctl/compute.py).
services:
  immich-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video]
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2-cuda@sha256:0a8aeaeb6771da78c4f54bc00b429b113267db50aa121aa6e30f78ef86a31e33
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
