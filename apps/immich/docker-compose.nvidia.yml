# NVIDIA computers: Immich's own CUDA build runs face recognition and smart search on the GPU
# (docs.immich.app/features/ml-hardware-acceleration). Chosen by the compute mode (ctl/compute.py).
services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5-cuda@sha256:ba820b5b2ce199ef085bd5a42f092218f16994149019c5ab252bf387c22a99b4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
