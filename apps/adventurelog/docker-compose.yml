name: mu3lab-adventurelog

services:
  app:
    image: ghcr.io/seanmorley15/adventurelog:v0.13.0@sha256:08bf228403dc99559a661e0d03a5ff08823da21a47fb7ab281dcef98794571ec
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8015}
      DJANGO_SETTINGS_MODULE: main.mu3lab_settings
      # Without these, AdventureLog's startup creates a default admin/admin superuser on every
      # restart. Naming the owner's existing account makes it create nothing.
      DJANGO_ADMIN_USERNAME: ${MU3LAB_OWNER_USERNAME:?the owner's username is required}
      DJANGO_ADMIN_EMAIL: ${MU3LAB_OWNER_EMAIL:?the owner's email is required}
      DJANGO_ADMIN_PASSWORD: ${MU3LAB_OWNER_FALLBACK_PASSWORD:?a fallback password is required}
      DEBUG: "false"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: db
      POSTGRES_DB: adventurelog
      POSTGRES_USER: adventure
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      PORT: "3000"
      SOCIALACCOUNT_ALLOW_SIGNUP: "true"
      FORCE_SOCIALACCOUNT_LOGIN: ${ADVENTURELOG_FORCE_SOCIAL_LOGIN:-true}
      ADVENTURELOG_OIDC_CLIENT_ID: ${ADVENTURELOG_OIDC_CLIENT_ID:-}
      ADVENTURELOG_OIDC_CLIENT_SECRET: ${ADVENTURELOG_OIDC_CLIENT_SECRET:-}
      ADVENTURELOG_OIDC_DISCOVERY_URL: ${ADVENTURELOG_OIDC_DISCOVERY_URL:-}
    ports: ["127.0.0.1:8015:80"]
    volumes:
      - ./mu3lab_settings.py:/code/main/mu3lab_settings.py:ro
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/adventurelog/media:/code/media
    depends_on:
      db: {condition: service_healthy}
    networks:
      mu3lab_frontend: {}
      mu3lab_backend:
        aliases: [adventurelog-app]
      adventurelog_internal: {}
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 90s

  db:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    restart: unless-stopped
    environment:
      POSTGRES_DB: adventurelog
      POSTGRES_USER: adventure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/adventurelog/postgres:/var/lib/postgresql/data
    networks: [adventurelog_internal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventure -d adventurelog"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
  adventurelog_internal: {internal: true}
