# Seerr — see ctl/manifest/models.py for every field.
# The household's request page, at home like Jellyfin (http://<home address>:5055) and on the
# tailnet behind Authentik's gate for the household (the owner's choice). People sign in with
# their Jellyfin login at both addresses; Seerr asks Jellyfin to check it. A requested film goes
# to Radarr and a show to Sonarr, and Seerr shows it as available once it is in Jellyfin. Mu3Lab
# sets it all up (hooks.py).
id: seerr
name: Seerr
tier: optional
group: apps
category: media
stack: streaming
tagline: Ask for the films and shows you want to watch
summary: Browse what's popular or search for a film or show, tap Request, and it is downloaded and appears in
  Jellyfin, usually within the hour. Administrators' requests go straight through, and they approve everyone
  else's. Works at home and on the tailnet, with your Jellyfin login. Needs Jellyfin, plus Radarr for films and
  Sonarr for shows.
widgets:
- id: requests
  title: Requests
  description: Films and shows asked for, waiting, on their way and ready to watch.
  refresh_seconds: 120
  largest: [12, 10]
  start: [4, 4]
version: "v3.5.2"
upstream: seerr-team/seerr
depends_on: [jellyfin]
backup:
  ignore:
  - seerr/config/logs
  - seerr/config/cache
service:
  local_port: 5055
  # People reach Seerr here at home (the compose file binds ${MU3LAB_HOME_IP}), and through the
  # tailnet route below, which proxies to the loopback port.
  extra_ports:
  - port: 5055
    purpose: home-network address for phones and browsers at home
    listen: home
  health:
    path: /api/v1/status
# On the tailnet, Authentik admits the household first; Seerr's own Jellyfin login follows.
route:
  https_port: 8483
  caddy_port: 19483
  access: gate
  audience: household
sign_in:
  method: local
  note: Seerr signs you in with your Jellyfin login, at home and on the tailnet (after Authentik there). Mu3Lab
    saved that login to your vault for both Seerr addresses, so Bitwarden fills it in.
account:
  # Seerr's owner is Jellyfin's hidden Mu3Lab administrator (mu3lab-service); people are added by hooks.py.
  mode: api_bootstrap
  needs_owner: false
  user_action: Open Seerr; Bitwarden fills in your Jellyfin login.
env:
  # This server's home-network address and network (rule home_network follows them if they change).
  MU3LAB_HOME_IP: '{{home_ip}}'
  MU3LAB_HOME_NETWORK: '{{home_network}}'
integrates_with:
# Seerr signs in to Jellyfin as its hidden administrator once, to set itself up (hooks.py).
- capability: videos
  env:
    MU3LAB_JELLYFIN_ADMIN_PASSWORD: '{{provider:JELLYFIN_ADMIN_PASSWORD}}'
# Requests go to Sonarr and Radarr while they are installed.
- capability: tv_automation
  env:
    MU3LAB_SONARR_API_KEY: '{{provider:SONARR_API_KEY}}'
- capability: movie_automation
  env:
    MU3LAB_RADARR_API_KEY: '{{provider:RADARR_API_KEY}}'
rules:
- rule: home_network
- rule: per_person_logins
  with:
    audience: household
    purpose: Let each household member sign in to Seerr with their Jellyfin login
resource_guidance: Light. Seerr only asks for downloads; the films and shows take space in Jellyfin's libraries.
setup_action: Install Seerr so everyone at home can ask for films and shows.
mobile:
  primary: seerr-web
  clients:
  - id: seerr-web
    name: Seerr in the browser
    kind: web
    support: official
    platforms:
    - ios
    - android
    - web
    install: {}
    homepage: https://seerr.dev/
    setup: web
    summary: Request films and shows from any phone or computer, at home or on the tailnet; add it to the home
      screen.
    fallback: true
    steps:
    - Connect your phone to the Mu3Lab tailnet, or to your home Wi-Fi.
    - Open the address shown on this page (the home address at home); Bitwarden fills in your Jellyfin login.
    - Search for a film or show and tap Request.
