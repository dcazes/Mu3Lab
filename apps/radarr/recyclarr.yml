# Mu3Lab's quality rules for Radarr, applied by Recyclarr (see hooks.py) at every start and weekly.
# Owner's choices (2026-11-18): 4K first, else 1080p, 720p or DVD; the first good copy is kept
# (no upgrades). Blu-ray disc images, remuxes, cams, telesyncs and screeners are never taken; every
# HDR and Dolby Vision kind is fine. Sizes are MB per minute of running time: minimums and maximums
# are TRaSH Guides'; the preferred size (the tie-breaker between copies of one quality) is Mu3Lab's,
# about 20 GB for a 2-hour 4K film, 10 GB in 1080p and 5 GB in 720p (TV in Sonarr is scaled the same way).
radarr:
  mu3lab:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    # Only formats Recyclarr itself made and this file no longer names are removed.
    delete_old_custom_formats: true
    quality_definition:
      type: movie
      # DVD-grade qualities have no TRaSH sizes; the app's own stay.
      qualities:
        - name: WEBDL-2160p
          preferred: 170
        - name: WEBRip-2160p
          preferred: 170
        - name: Bluray-2160p
          preferred: 170
        - name: HDTV-2160p
          preferred: 170
        - name: WEBDL-1080p
          preferred: 85
        - name: WEBRip-1080p
          preferred: 85
        - name: Bluray-1080p
          preferred: 85
        - name: HDTV-1080p
          preferred: 85
        - name: WEBDL-720p
          preferred: 42
        - name: WEBRip-720p
          preferred: 42
        - name: Bluray-720p
          preferred: 42
        - name: HDTV-720p
          preferred: 42
    quality_profiles:
      # Seerr sends every request to this profile by name (apps/seerr/hooks.py).
      - name: Mu3Lab
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: false
          until_quality: 4K
        min_format_score: 0
        quality_sort: top
        # Best first; any quality in a group counts the same. Anything not listed is not allowed.
        qualities:
          - name: 4K
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-2160p
              - HDTV-2160p
          - name: 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - Bluray-1080p
              - HDTV-1080p
          - name: 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - Bluray-720p
              - HDTV-720p
          - name: DVD
            qualities:
              - DVD
              - Bluray-576p
              - Bluray-480p
    custom_formats:
      # Never downloaded: scored far below the profile's minimum of 0.
      - trash_ids:
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
        assign_scores_to:
          - name: Mu3Lab
            score: -10000
