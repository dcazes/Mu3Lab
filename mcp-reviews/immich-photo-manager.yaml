blocked:
  update_credentials: Lets a chat change which server and API key the connector uses.
  get_connection_info: Reveals the connector's server address and key details; Mu3Lab reports connection health itself.
  empty_trash: Permanently deletes everything in the trash in one call. Empty the trash in Immich itself.
  upload_asset: Uploads from a file path inside the connector's container, where chat has no files.
  export_pdf: Writes files inside the connector's container, which the owner cannot reach from chat.
  get_export_preview: Only useful with export_pdf, which is blocked.
  download_archive: Builds a download inside the connector's container, which the owner cannot reach from chat.
  get_download_info: Only useful with download_archive, which is blocked.
  ping: Diagnostics; Mu3Lab checks connector health itself.
  get_server_version: Diagnostics; Mu3Lab checks connector health itself.
  get_capabilities: Diagnostics; Mu3Lab checks connector health itself.
