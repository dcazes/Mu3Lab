schema_version: 1
server: immich-photo-manager
revision: "2.0.11"
reviewed_at: "2026-09-30"
guidance: |
  Asset ids come from search results; pass them to other tools rather than guessing.
  Search by what is in the picture with search_smart ("dog on a beach"); search by date, place,
  camera or person with search_metadata. Deleting moves photos to Immich's trash, where the
  owner can restore them.

categories:
  - id: search
    title: Search and details
    summary: Find photos and videos by what is in them, text in them, date, place or camera; read a photo's details and library statistics.
  - id: albums
    title: Albums
    summary: List and open albums; create, rename and delete albums and add or remove photos.
  - id: people
    title: People and faces
    summary: List and find recognised people and their photos; rename, merge or fix faces.
  - id: timeline
    title: Timeline and memories
    summary: Browse the library by month and day, and list or edit "on this day" memories.
  - id: tags
    title: Tags
    summary: List tags and the photos under them; create, rename and delete tags and tag photos.
  - id: duplicates
    title: Duplicates and stacks
    summary: Find duplicate photos and stacked shots (RAW and JPEG, bursts); resolve duplicates and edit stacks.
  - id: editing
    title: Editing details
    summary: Change a photo's description, date, location, rating, favourite or archive state, and rotate photos.
  - id: viewing
    title: Viewing images
    summary: Load photos, thumbnails and video frames into the chat so a model that can see images can describe them.
    default_on: false
  - id: sharing
    title: Sharing
    summary: List and create public share links, partner sharing, and comments and likes.
    default_on: false
  - id: trash
    title: Trash
    summary: Move photos to the trash and restore them from it.
    default_on: false
  - id: review_notes
    title: Cleanup notes
    summary: Keep notes on which photos were already reviewed during a long cleanup, so nothing is checked twice.
    default_on: false

