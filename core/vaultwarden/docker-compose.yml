# Vaultwarden is deliberately not exposed through MCP or generic SSO automation.
services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine
    environment:
      ROCKET_PORT: "80"
      DOMAIN: ${VAULTWARDEN_DOMAIN:-}
    volumes:
      - ${MU3LAB_DATA_ROOT:-/srv/mu3lab/data}/vaultwarden:/data
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /run]
    networks: [mu3lab_frontend, mu3lab_backend]

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
