# Mu3Lab Authentik identity service. Only Caddy/Tailscale expose it remotely.
services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-postgresql:/var/lib/postgresql/data
    networks: [mu3lab_backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    restart: unless-stopped
    command: server
    env_file: ${AUTHENTIK_ENV_FILE:-.env}
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    ports: ["127.0.0.1:9001:9000"]
    networks: [mu3lab_frontend, mu3lab_backend]
    depends_on:
      postgresql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 12

  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    restart: unless-stopped
    command: worker
    env_file: ${AUTHENTIK_ENV_FILE:-.env}
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    networks: [mu3lab_frontend, mu3lab_backend]
    depends_on:
      postgresql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 12

volumes:
  authentik-postgresql:
  authentik-media:
  authentik-templates:

networks:
  mu3lab_frontend: {external: true}
  mu3lab_backend: {external: true}
