name: mu3lab-test-vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5-alpine@sha256:bbe684a02d6b0db54256ff88eac9754f4519284a7b26314afc241fd7d0918191
    environment:
      ROCKET_PORT: '80'
      ADMIN_TOKEN: ${MU3LAB_TEST_VAULT_ADMIN_TOKEN:?test admin hash required}
      SIGNUPS_ALLOWED: 'true'
      INVITATIONS_ALLOWED: 'true'
    ports: ['127.0.0.1:19902:80']
    volumes: [vault-data:/data]
volumes:
  vault-data: {}
