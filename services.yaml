# Mu3Lab curated service registry.
#
# This file is the source of truth for deployment facts and app descriptions.
# Bundle definitions live in catalog.yaml; neither file may contain credentials or user data.
schema_version: 4
settings:
  runtime_root: /srv/mu3lab
  dashboard_port: 8787
  tailnet_hostname: mu3lab
  backup_retention:
    daily: 7
    weekly: 4
    monthly: 12

services:
  - id: ingress
    summary: "Routes requests to Mu3Lab apps over HTTPS. Caddy provides the internal web server and reverse proxy used to publish private app addresses."
    tagline: "Private HTTPS web server"
    maturity: supported
    name: Caddy
    category: infrastructure
    lifecycle: always_on
    compose_dir: core/ingress
    https_port: 443
    private_https_port: 8446
    proxy_port: 19460
    health: {kind: http, url: "http://127.0.0.1:19460/__mu3lab_caddy_health"}
    auth: excluded
    stage: foundation
    images: ["caddy:2.10.2-alpine"]
    update: {repository: caddyserver/caddy, current_version: v2.10.2}
    route: ready
    ui: {available: false, unavailable_reason: "Caddy is Mu3Lab's internal reverse proxy and has no end-user dashboard."}
    required: true
    setup_action: "Private ingress is installed and checked by the bootstrapper."
    backup: {volumes: [caddy-data, caddy-config]}

  - id: authentik
    summary: "Manages user accounts and access to Mu3Lab. Authentik provides a shared sign-in for compatible apps and an additional sign-in gate for selected services."
    tagline: "Single sign-on for your apps"
    maturity: supported
    name: Authentik
    category: infrastructure
    lifecycle: always_on
    compose_dir: core/authentik
    https_port: 9001
    private_https_port: 443
    proxy_port: 19461
    health: {kind: http, url: "http://127.0.0.1:9001/-/health/ready/"}
    auth: excluded
    stage: foundation
    images: ["postgres:16-alpine", "ghcr.io/goauthentik/server:2026.5.0"]
    update: {repository: goauthentik/authentik, current_version: "2026.5.0"}
    route: pending
    ui: {available: true, authentication: local}
    required: true
    setup_action: "Create the Authentik administrator and Mu3Lab application."
    backup: {database: authentik, volumes: [authentik-media, authentik-templates]}

  - id: vaultwarden
    summary: "Stores passwords, secure notes, and other vault items on your server. Vaultwarden works with Bitwarden clients to sync your vault and fill saved logins across devices."
    tagline: "Password manager for Bitwarden apps"
    maturity: supported
    name: Vaultwarden
    category: infrastructure
    lifecycle: always_on
    compose_dir: core/vaultwarden
    https_port: 8081
    private_https_port: 8443
    proxy_port: 19462
    health: {kind: http, url: "http://127.0.0.1:8081/alive"}
    auth: excluded
    stage: foundation
    mobile:
      primary: bitwarden
      clients:
        - id: bitwarden
          name: Bitwarden
          kind: native
          support: official
          platforms: [ios, android]
          install:
            ios: https://apps.apple.com/us/app/bitwarden-password-manager/id1137397744
            android: https://play.google.com/store/apps/details?id=com.x8bit.bitwarden
          homepage: https://bitwarden.com/download/
          setup: server_url
          summary: "The official Bitwarden client connects directly to your private Vaultwarden server."
          steps:
            - "Install Bitwarden for your phone."
            - "Before signing in, choose the self-hosted environment and paste the Mu3Lab server URL."
            - "Sign in with your Mu3Lab email and password."

    images: ["vaultwarden/server:1.37.3-alpine@sha256:9a905c5cf5df61bb827da3805e160170741c0b53b0c63bb07e1afd3d2e21b1c8"]
    update: {repository: dani-garcia/vaultwarden, current_version: "1.37.3"}
    route: pending
    ui: {available: true, authentication: local}
    required: true
    setup_action: "Create the first Vaultwarden account locally, then use its private tailnet URL."
    identity_note: "Independent Vaultwarden login; never Authentik-gated."
    backup: {binds: [data]}
    mcp: {exposed: false}

  - id: ollama
    summary: "Runs AI models and generates text embeddings on your server. Mu3Lab uses Ollama as an internal API for local inference and document search; it has no browser interface."
    tagline: "Runs AI models on your server"
    maturity: supported
    name: Ollama
    category: ai
    lifecycle: shared
    compose_dir: core/ollama
    https_port: 11434
    health: {kind: http, url: "http://127.0.0.1:11434/"}
    auth: excluded
    compute: {applies: true}
    stage: core
    required: true
    route: pending
    ui: {available: false, unavailable_reason: "Ollama is an internal model and embedding API; it does not ship a browser UI."}
    images: ["ollama/ollama:0.34.1"]
    update: {repository: ollama/ollama, current_version: v0.34.1}
    setup_action: "Install and verify the model runner using the host-wide compute setting."
    resource_guidance: "Model downloads determine disk and memory use."
    backup: {binds: [data]}
    identity_note: "Internal-only embedding and tiny-model runner; no browser or MCP route."
    mcp: {exposed: false}

  - id: litellm
    summary: "Provides a unified API for local and external AI models. Mu3Lab uses LiteLLM to route chat and embedding requests through one gateway for connected apps."
    tagline: "One gateway for all AI models"
    maturity: supported
    name: LiteLLM
    category: ai
    lifecycle: shared
    compose_dir: core/litellm
    https_port: 4000
    private_https_port: 8454
    proxy_port: 19471
    health: {kind: http, url: "http://127.0.0.1:4000/health/liveliness"}
    auth: proxy
    stage: core
    required: true
    route: pending
    ui: {available: true, path: "/ui/", authentication: proxy}
    setup_action: "Connect Ollama and optional provider routes, then run a test request."
    resource_guidance: "Low host overhead; provider and model choice determines usage."
    images: ["ghcr.io/berriai/litellm:v1.92.0"]
    update: {repository: BerriAI/litellm, current_version: v1.92.0}
    dependencies: [ollama]
    backup: {binds: [config]}
    identity_note: "Authentik protects the private dashboard route. LiteLLM Community does not receive a native per-user OIDC session."
    mcp: {exposed: false}

  - id: freellmapi
    summary: "Connects multiple AI providers through an OpenAI-compatible API, with model routing and automatic failover. Mu3Lab manages provider keys in AI providers settings; availability depends on each provider’s limits."
    tagline: "Pools free AI providers with failover"
    maturity: supported
    name: FreeLLMAPI
    category: ai
    lifecycle: optional
    compose_dir: apps/freellmapi
    https_port: 3001
    private_https_port: 8455
    proxy_port: 19472
    health: {kind: http, url: "http://127.0.0.1:3001/api/ping"}
    auth: proxy
    stage: core
    required: true
    route: pending
    ui: {available: true, authentication: proxy}
    setup_action: "Mu3Lab manages provider configuration privately; its native dashboard is available for operator recovery."
    resource_guidance: "Optional provider route inside the mandatory core suite."
    images: ["ghcr.io/tashfeenahmed/freellmapi:v0.11.0"]
    update: {repository: TashfeenAhmed/FreeLLMAPI, current_version: v0.11.0}
    backup: {binds: [data]}
    identity_note: "Authentik protects the private dashboard route. FreeLLMAPI has no header-based login, so its generated local account is saved to your Vaultwarden."

  - id: surfsense
    summary: "An AI research workspace for searching documents and web sources, organizing knowledge, and asking questions with source citations. Mu3Lab connects this self-hosted web app to its AI gateway and local embedding service."
    tagline: "AI research with cited sources"
    maturity: supported
    name: SurfSense
    category: research
    lifecycle: optional
    compose_dir: apps/surfsense
    https_port: 3929
    private_https_port: 8447
    proxy_port: 19464
    health: {kind: http, url: "http://127.0.0.1:3929/__mu3lab_surfsense_health"}
    auth: local
    dependencies: [litellm, ollama]
    availability: available
    stage: optional
    required: false
    route: pending
    ui: {available: true, authentication: proxy}
    identity_note: "Authentik protects the private route; SurfSense keeps a separate local login, generated during installation and ready to save in Bitwarden. This is not SSO."
    setup_action: "Install SurfSense and save its generated login to Bitwarden."
    resource_guidance: "Runs PostgreSQL, Redis, SearXNG, workers, and zero-cache. The privileged SurfSense sandbox is disabled."
    mobile:
      primary: surfsense-web
      clients:
        - id: surfsense-web
          name: SurfSense mobile web
          kind: web
          support: official
          platforms: [ios, android, web]
          install: {}
          homepage: https://github.com/MODSetter/SurfSense
          setup: web
          summary: "SurfSense has a responsive web interface but no confirmed native app or installable PWA."
          steps:
            - "Connect the phone to your Mu3Lab tailnet."
            - "Open the private SurfSense URL in the phone browser."
            - "Complete Authentik, then let Bitwarden fill in your SurfSense login."
    configuration:
      - {key: registration_enabled, env: REGISTRATION_ENABLED, type: boolean, label: "Allow new local accounts", default: true}
    images: ["ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973", "ghcr.io/modsetter/surfsense-web:0.0.40@sha256:47e0f832c4c6ddbc5a144e4960ab1de9cd70c68926436cfc2099553f14595b55", "pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f", "redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0", "searxng/searxng:2026.3.13-3c1f68c59@sha256:174f6a8498d88d2d98c265a952c2d552859bf315cd505746d1c0d4fbec37952f", "rocicorp/zero:1.6.0@sha256:53e66c78b2d2ecf240b6d0e9e0c9c77d2abd6774a0efa84107b5c86ac9f59965", "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d"]
    update: {repository: MODSetter/SurfSense, current_version: "v0.0.40"}
    backup: {database: surfsense, binds: [object-store, zero-cache]}
    mcp:
      kind: official
      endpoint: http://surfsense-mcp:8080/mcp
      auth: personal-api-token
      scopes: [workspace-read, knowledge-read, knowledge-write, scraper-run]
      exposed: false
      tools: []
    account:
      mode: local_account_manual
      handoff: false
      user_action: "Open SurfSense after installation and create its separate local account."

    configuration:
      - {key: registration_enabled, env: REGISTRATION_ENABLED, type: boolean, label: "Enable local sign-in", default: true}
    images: ["ghcr.io/modsetter/surfsense-backend:0.0.40@sha256:e4cc6dfb2017b804cb29a8e757d2188c263fafacd0ace16bb4319c85b52ed973", "ghcr.io/modsetter/surfsense-web:0.0.40@sha256:47e0f832c4c6ddbc5a144e4960ab1de9cd70c68926436cfc2099553f14595b55", "pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f", "redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0", "searxng/searxng:2026.3.13-3c1f68c59@sha256:174f6a8498d88d2d98c265a952c2d552859bf315cd505746d1c0d4fbec37952f", "rocicorp/zero:1.6.0@sha256:53e66c78b2d2ecf240b6d0e9e0c9c77d2abd6774a0efa84107b5c86ac9f59965", "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d"]
    update: {repository: MODSetter/SurfSense, current_version: "v0.0.40"}
    backup: {database: surfsense, binds: [object-store, zero-cache]}
    mcp:
      kind: official
      endpoint: http://surfsense-mcp:8080/mcp
      auth: personal-api-token
      scopes: [workspace-read, knowledge-read, knowledge-write, scraper-run]
      exposed: false
      tools: []
    account:
      mode: api_bootstrap
      handoff: true
      user_action: "Save the generated SurfSense login to Bitwarden, then use autofill when opening it."

  - id: firecrawl
    summary: "Converts web pages into Markdown and structured data for AI tools. Mu3Lab runs the self-hosted scraping and crawling API and connects it to chat for web research."
    tagline: "Turns web pages into AI-ready text"
    maturity: supported
    name: Firecrawl
    category: research
    # Part of the core suite: installed and connected to chat by core setup.
    # Its stage stays "optional" so it uses the full app installer.
    lifecycle: always_on
    compose_dir: apps/firecrawl
    https_port: 3002
    private_https_port: 8456
    proxy_port: 19473
    health: {kind: http, url: "http://127.0.0.1:3002/"}
    auth: excluded
    stage: optional
    availability: available
    required: true
    route: pending
    dependencies: []
    ui: {available: true, authentication: excluded}
    identity_note: "Firecrawl is an API service with no application login. Its route remains private to the tailnet."
    setup_action: "Install the private Firecrawl API, queue workers, Playwright browser service, and durable data services."
    resource_guidance: "Runs Firecrawl workers, Playwright, RabbitMQ, PostgreSQL, and Redis. Browser crawls can use substantial memory; concurrency defaults are intentionally conservative."
    images: ["ghcr.io/firecrawl/firecrawl:2.11.334-production@sha256:70453d7102cce7000f4e8e80bd11e3e1353cdc9a0b87bb4cd1d4e8edf5a65744", "ghcr.io/firecrawl/playwright-service@sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b", "ghcr.io/firecrawl/nuq-postgres@sha256:9b638af78d99873bc0ba2b57c9cbcd01df6ce96efeaa72d36cfbe0f76521e8fc", "rabbitmq:3.13-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc", "redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"]
    update: {repository: firecrawl/firecrawl, current_version: "v2.11.0"}
    backup: {database: firecrawl, binds: [postgres, redis, rabbitmq]}
    account: {mode: none, handoff: false, user_action: "No login is required on the private Firecrawl API route."}

  - id: lobehub
    summary: "An AI chat workspace for conversations, assistants, and connected tools. Mu3Lab connects LobeChat to configured models through LiteLLM and stores conversation history on your server."
    tagline: "Chat with your AI models"
    maturity: supported
    name: LobeChat
    category: ai
    lifecycle: always_on
    compose_dir: apps/lobehub
    https_port: 3211
    private_https_port: 8457
    proxy_port: 19474
    health: {kind: http, url: "http://127.0.0.1:3211/__mu3lab_lobehub_health"}
    auth: oidc
    stage: core
    availability: available
    required: true
    route: pending
    dependencies: [litellm, authentik]
    ui: {available: true, authentication: oidc}
    identity_note: "LobeChat uses its own Authentik OIDC session and persists conversations in its private database."
    setup_action: "Connect LobeChat to LiteLLM and sign in with Authentik."
    resource_guidance: "Runs LobeChat, PostgreSQL, Redis, and private object storage. Expect moderate memory and disk use."
    mobile:
      primary: lobechat-pwa
      clients:
        - id: lobechat-pwa
          name: LobeChat PWA
          kind: pwa
          support: official
          platforms: [ios, android, web]
          install: {}
          homepage: https://lobehub.com/
          setup: pwa
          summary: "Use the self-hosted LobeChat web app directly and add it to the Home Screen."
          steps:
            - "Open the private LobeChat URL on the phone and sign in with Authentik."
            - "Use the browser menu to add LobeChat to the Home Screen or install the web app."
        - id: lobehub-native
          name: LobeHub native app
          kind: native
          support: experimental
          platforms: [ios, android]
          install:
            ios: https://apps.apple.com/us/app/lobehub-ai-agent-teammates/id6749615954
            android: https://play.google.com/store/apps/details?id=com.lobehub.app
          homepage: https://lobehub.com/downloads
          setup: developer_mode
          summary: "The official native client can connect to self-hosted LobeChat through its Developer Mode."
          caveat: "Self-hosted setup currently requires a LobeHub community account and an experimental Developer Mode flow."
          steps:
            - "Install LobeHub and sign in to or create a LobeHub community account."
            - "In Settings, tap the version number repeatedly to enable Developer Mode."
            - "Enter the Mu3Lab LobeChat URL as the custom server."

    images: ["lobehub/lobehub:2.2.18@sha256:b7c843911259c54c92f03864d9dd2e9099e18525de1d37498b64cc15751d087d", "paradedb/paradedb:0.25.9-pg17@sha256:8da5d202fe31875af32a49e802ce17cfbc146b0672306f4109809efee1e6f916", "redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d", "rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff", "rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699", "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d"]
    update: {repository: lobehub/lobehub, current_version: "v2.2.18"}
    backup: {database: lobehub, binds: [postgres, redis, object-store]}
    account:
      mode: oidc_first_login
      handoff: false
      user_action: "Use the existing Authentik session; local email/password registration is disabled."

  - id: actual-budget
    summary: "A personal finance app built around envelope budgeting. Track accounts and transactions, plan spending, and review financial reports, with budget data synced through your own server."
    tagline: "Envelope budgeting and spending"
    maturity: supported
    name: Actual Budget
    category: finance
    lifecycle: optional
    compose_dir: apps/actual-budget
    https_port: 5006
    private_https_port: 8448
    proxy_port: 19465
    health: {kind: http, url: "http://127.0.0.1:5006/"}
    auth: oidc
    stage: optional
    availability: available
    route: pending
    ui: {available: true, authentication: oidc}
    setup_action: "Install only when you want private budgeting."
    resource_guidance: "Lightweight personal finance service."
    mobile:
      primary: actual-pwa
      clients:
        - id: actual-pwa
          name: Actual Budget PWA
          kind: pwa
          support: official
          platforms: [ios, android, web]
          install: {}
          homepage: https://actualbudget.org/docs/faq/
          setup: pwa
          summary: "Actual recommends its responsive installable web app instead of the deprecated native clients."
          steps:
            - "Open the private Actual Budget URL on the phone."
            - "Complete sign-in, then use the browser menu to add Actual to the Home Screen."

    configuration:
      - {key: oidc_enforced, env: ACTUAL_OPENID_ENFORCE, type: boolean, label: "Require Authentik login", default: true}
      - {key: user_creation, env: ACTUAL_USER_CREATION_MODE, type: enum, label: "OIDC user creation", options: [manual, login], default: login}
    images: ["docker.io/actualbudget/actual-server:26.9.0"]
    backup: {binds: [data]}
    update: {repository: actualbudget/actual, current_version: "v26.9.0"}
    mcp:
      kind: adapter
      endpoint: http://127.0.0.1:8813/mcp
      auth: service-token
      scopes: [budget-read, transaction-write]
      exposed: false
      tools:
        - {id: actual.budget_summary, title: Read budget summary, risk: read}
        - {id: actual.transactions, title: Read transactions, risk: read}
        - {id: actual.prepare_transaction, title: Prepare transaction, risk: draft}
        - {id: actual.create_transaction, title: Create approved transaction, risk: write}
    account:
      mode: oidc_first_login
      handoff: false
      user_action: "Open Actual Budget; your existing Authentik session creates the server owner automatically."

  - id: immich
    summary: "Manages your photo and video library on your server. Upload media from your phone, organize shared albums, and find images using metadata, facial recognition, and visual search."
    tagline: "Photo and video backup"
    maturity: supported
    name: Immich
    category: media
    lifecycle: optional
    compose_dir: apps/immich
    https_port: 2283
    private_https_port: 8449
    proxy_port: 19466
    health: {kind: http, url: "http://127.0.0.1:2283/api/server/ping"}
    auth: oidc
    stage: optional
    availability: available
    route: pending
    ui: {available: true, authentication: oidc}
    setup_action: "Install only when you want private photo management."
    resource_guidance: "Media storage and machine-learning jobs can be resource intensive."
    identity_note: "Supports native Authentik OAuth; password login is disabled only after the existing owner is linked and verified."
    mobile:
      primary: immich-mobile
      clients:
        - id: immich-mobile
          name: Immich
          kind: native
          support: official
          platforms: [ios, android]
          install:
            ios: https://apps.apple.com/us/app/immich/id1613945652
            android: https://play.google.com/store/apps/details?id=app.alextran.immich
          homepage: https://immich.app/docs/features/mobile-app/
          setup: server_url
          summary: "The official Immich client provides photo browsing and automatic mobile backup."
          steps:
            - "Install Immich and paste the Mu3Lab Immich server URL."
            - "Choose OAuth login and complete the Authentik sign-in in the browser."
            - "Select the albums you want Immich to back up."

    images: ["ghcr.io/immich-app/immich-server:v3.2.2", "ghcr.io/immich-app/immich-machine-learning:v3.2.2", "docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf", "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"]
    update: {repository: immich-app/immich, current_version: "v3.2.2"}
    backup: {binds: [library, database]}
    account:
      mode: api_bootstrap
      handoff: true
      user_action: "The administrator is created during installation. Open Immich to use your existing Authentik session."

  - id: mealie
    summary: "Organizes household recipes, meal plans, and shopping lists. Import recipes from websites or add your own, schedule meals, and turn recipe ingredients into shopping lists."
    tagline: "Recipes, meal plans, and shopping lists"
    maturity: supported
    name: Mealie
    category: home
    lifecycle: optional
    compose_dir: apps/mealie
    https_port: 9925
    private_https_port: 8450
    proxy_port: 19467
    health: {kind: http, url: "http://127.0.0.1:9925/api/app/about"}
    auth: oidc
    stage: optional
    availability: available
    route: pending
    ui: {available: true, authentication: oidc}
    setup_action: "Install only when you want private recipe and meal planning."
    resource_guidance: "Lightweight service."
    mobile:
      primary: ghee
      clients:
        - id: ghee
          name: Ghee for Mealie
          kind: native
          support: community
          platforms: [ios, android]
          install:
            ios: https://apps.apple.com/us/app/ghee-for-mealie-recipes/id6758328014
            android: https://play.google.com/store/apps/details?id=casa.dsen.ghee
          setup: server_url
          summary: "A polished community client for recipes, meal plans, shopping lists, and cooking."
          caveat: "Core features are free; expanded offline features are an optional purchase."
          steps:
            - "Install Ghee and enter the Mu3Lab Mealie URL."
            - "Choose OIDC and complete the Authentik sign-in."
        - id: mealie-pwa
