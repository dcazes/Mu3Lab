  - id: baby-buddy
    maturity: supported
    name: Baby Buddy
    category: family
    lifecycle: optional
    compose_dir: apps/baby-buddy
    https_port: 8002
    private_https_port: 8458
    proxy_port: 19475
    health: {kind: http, url: "http://127.0.0.1:8002/"}
    auth: trusted_header
    stage: optional
    availability: available
    required: false
    route: pending
    ui: {available: true, authentication: trusted_header}
